- name: Set cifmw_num_osds_perhost
# By defualt 1 OSD is created per node in case of multinode.
# 3 OSDS will be created for single node env to accomodate
# more ceph resources and avoid PG errors.
  ansible.builtin.set_fact:
    cifmw_num_osds_perhost: |
      {% if groups[cifmw_ceph_target | default('computes')] | length == 1 %}
      {% set num_osds =  3 %}
      {% else %}
      {% set num_osds = 1 %}
      {% endif %}
      {{ num_osds }}

- name: Create a Ceph spec
  ansible.builtin.template:
    src: templates/ceph_spec.yml.j2
    dest: "{{ cifmw_ceph_spec_path }}"
    mode: "0644"
    force: true

- name: Create an initial Ceph conf file
  ansible.builtin.template:
    src: templates/initial_ceph.conf.j2
    dest: "{{ cifmw_ceph_spec_path_initial_conf }}"
    mode: "0644"
    force: true

# Snapshot under a *new* name. Extra-vars always beat set_fact of the same
# name (ansible/ansible#19934), so reusing cifmw_ceph_spec_public_network
# cannot capture the value. Role params also do not leak to later plays.
# ceph.yml reads these facts instead of ansible.builtin.ini (broken on
# Python 3.12 / ConfigParser.readfp).
- name: Export networks written into the initial Ceph conf
  ansible.builtin.set_fact:
    cifmw_ceph_spec_rendered_public_network: "{{ cifmw_ceph_spec_public_network }}"
    cifmw_ceph_spec_rendered_private_network: "{{ cifmw_ceph_spec_private_network }}"
