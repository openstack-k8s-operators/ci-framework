- name: Initialize S2I content-set facts
  ansible.builtin.set_fact:
    cifmw_s2i_content_set_digests: {}
    cifmw_s2i_content_set_resolved_images: []
    cifmw_s2i_content_set_resolved_commit: "{{ cifmw_s2i_content_set_commit | default('') }}"
    cifmw_s2i_content_set_from_catalog: false
    cifmw_s2i_content_set_inspect_labels: {}

- name: Resolve s2iCommit from the operator pin file
  when: cifmw_s2i_content_set_resolved_commit | length == 0
  ansible.builtin.include_tasks: load_pin.yml

- name: Load a local digest catalog when present
  ansible.builtin.include_tasks: load_catalog.yml

- name: Inspect the promoted Quay set
  when: not cifmw_s2i_content_set_from_catalog | bool
  ansible.builtin.include_tasks: inspect_set.yml

- name: Emit cifmw_set_containers_images
  ansible.builtin.include_tasks: emit.yml

- name: Write the resolved content-set artifact
  ansible.builtin.include_tasks: write_artifact.yml
