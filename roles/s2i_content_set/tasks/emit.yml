- name: Overlay job-provided images on the resolved set
  ansible.builtin.set_fact:
    cifmw_s2i_content_set_merged: >-
      {{
        (
          cifmw_s2i_content_set_resolved_images |
          rejectattr('name', 'in', cifmw_s2i_content_set_skip_images) |
          rejectattr(
            'name',
            'in',
            (cifmw_set_containers_images | default([]) | map(attribute='name') | list)
          ) | list
        ) + (cifmw_set_containers_images | default([]) | list)
      }}

- name: Fail when no images were resolved
  when: cifmw_s2i_content_set_merged | length == 0
  ansible.builtin.fail:
    msg: >-
      s2i_content_set resolved an empty image list. Check the catalog, pin,
      mappings, skip list, and Quay tags for
      {{ cifmw_s2i_content_set_registry }}/{{ cifmw_s2i_content_set_namespace }}.

- name: Export cifmw_set_containers_images
  ansible.builtin.set_fact:
    cifmw_set_containers_images: "{{ cifmw_s2i_content_set_merged }}"
    cifmw_s2i_content_set_commit: "{{ cifmw_s2i_content_set_resolved_commit }}"
    cacheable: true

- name: Default preserve_unlisted so unmapped services keep payload defaults
  when: cifmw_set_containers_preserve_unlisted is not defined
  ansible.builtin.set_fact:
    cifmw_set_containers_preserve_unlisted: true
    cacheable: true
