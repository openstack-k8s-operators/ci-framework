- name: Check for operator pin file
  ansible.builtin.stat:
    path: "{{ cifmw_s2i_content_set_pin_file }}"
  register: cifmw_s2i_content_set_pin_stat

- name: Load operator pin file
  when: cifmw_s2i_content_set_pin_stat.stat.exists
  ansible.builtin.include_vars:
    file: "{{ cifmw_s2i_content_set_pin_file }}"
    name: cifmw_s2i_content_set_pin

- name: Record s2iCommit from the pin file
  when:
    - cifmw_s2i_content_set_pin_stat.stat.exists
    - (cifmw_s2i_content_set_pin.s2iCommit | default('')) | length > 0
  ansible.builtin.set_fact:
    cifmw_s2i_content_set_resolved_commit: "{{ cifmw_s2i_content_set_pin.s2iCommit }}"
