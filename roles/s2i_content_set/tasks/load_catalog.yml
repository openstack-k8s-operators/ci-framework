- name: Check for local content-set catalog
  ansible.builtin.stat:
    path: "{{ cifmw_s2i_content_set_catalog_file }}"
  register: cifmw_s2i_content_set_catalog_stat

- name: Load local content-set catalog
  when: cifmw_s2i_content_set_catalog_stat.stat.exists
  ansible.builtin.include_vars:
    file: "{{ cifmw_s2i_content_set_catalog_file }}"
    name: cifmw_s2i_content_set_catalog

- name: Use catalog when it matches the resolved commit
  when:
    - cifmw_s2i_content_set_catalog_stat.stat.exists
    - >-
      (cifmw_s2i_content_set_resolved_commit | length == 0) or
      (cifmw_s2i_content_set_catalog.s2iCommit | default('') ==
       cifmw_s2i_content_set_resolved_commit)
    - cifmw_s2i_content_set_catalog.openstackVersion is defined
    - cifmw_s2i_content_set_catalog.openstackVersion.customContainerImages is defined
  block:
    - name: Mark catalog as the source of the content set
      ansible.builtin.set_fact:
        cifmw_s2i_content_set_from_catalog: true
        cifmw_s2i_content_set_resolved_commit: >-
          {{
            cifmw_s2i_content_set_resolved_commit
            if (cifmw_s2i_content_set_resolved_commit | length > 0)
            else (cifmw_s2i_content_set_catalog.s2iCommit | default(''))
          }}

    - name: Convert catalog customContainerImages into set_containers entries
      ansible.builtin.set_fact:
        cifmw_s2i_content_set_resolved_images: "{{ cifmw_s2i_content_set_resolved_images + [cifmw_s2i_content_set_catalog_entry] }}"
      vars:
        cifmw_s2i_content_set_catalog_entry: >-
          {{
            {
              'name': item.key,
              'full_registry': item.value
            } if item.value is string else {
              'name': item.key,
              'full_registry': (item.value.values() | list | first),
              'backends': (item.value.keys() | list)
            }
          }}
      loop: "{{ cifmw_s2i_content_set_catalog.openstackVersion.customContainerImages | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.value is string or (item.value is mapping and (item.value | length > 0))
