- name: Ensure artifacts directory exists
  ansible.builtin.file:
    path: "{{ cifmw_s2i_content_set_dest_path | dirname }}"
    state: directory
    mode: "0755"

- name: Write resolved content-set artifact
  ansible.builtin.copy:
    dest: "{{ cifmw_s2i_content_set_dest_path }}"
    mode: "0644"
    content: "{{ cifmw_s2i_content_set_artifact | to_nice_yaml(indent=2) }}"
  vars:
    cifmw_s2i_content_set_artifact:
      schemaVersion: 1
      stream: "{{ cifmw_s2i_content_set_stream }}"
      s2iCommit: "{{ cifmw_s2i_content_set_resolved_commit }}"
      registry: "{{ cifmw_s2i_content_set_registry }}"
      namespace: "{{ cifmw_s2i_content_set_namespace }}"
      source: "{{ 'catalog' if (cifmw_s2i_content_set_from_catalog | bool) else 'inspect' }}"
      skip_images: "{{ cifmw_s2i_content_set_skip_images }}"
      images: "{{ cifmw_set_containers_images }}"

- name: Check for Zuul log directory
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/zuul-output/logs"
  register: cifmw_s2i_content_set_zuul_log_dir

- name: Copy artifact into Zuul logs
  when: cifmw_s2i_content_set_zuul_log_dir.stat.exists
  ansible.builtin.copy:
    src: "{{ cifmw_s2i_content_set_dest_path }}"
    dest: "{{ ansible_user_dir }}/zuul-output/logs/s2i-content-set.yaml"
    mode: "0644"
    remote_src: true
