# From software-factory/sf-infra project.
- name: Configure swap as a file
  become: true
  block:
    - name: Check if file already exist
      ansible.builtin.stat:
        path: "{{ cifmw_swap_file }}"
      register: _swap_file

    - name: Create swap if not exists
      when: not _swap_file.stat.exists
      block:
        # fallocate reserves the extents instantly and fails fast when the
        # filesystem is too small, instead of writing gigabytes of zeros.
        - name: Create swap file
          ansible.builtin.command: |
            fallocate -l {{ cifmw_swap_size }}M {{ cifmw_swap_file }}

        - name: Change permissions to the swap file
          ansible.builtin.file:
            path: "{{ cifmw_swap_file }}"
            owner: root
            group: root
            mode: "0600"

        - name: Make swap
          ansible.builtin.command: "mkswap {{ cifmw_swap_file }}"

        - name: Enable swap
          ansible.builtin.command: "swapon {{ cifmw_swap_file }}"

        - name: Add swap to the fstab
          ansible.posix.mount:
            fstype: swap
            src: "{{ cifmw_swap_file }}"
            name: none
            opts: sw
            state: present
