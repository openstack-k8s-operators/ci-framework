---
# Capture sensitive helper output in a file rather than command.stdout, which
# is not a reliable data channel under the Zuul command/logging integration.
- name: Create a private native helper result file
  ansible.builtin.tempfile:
    state: file
    prefix: native-private-result-
  register: cifmw_kustomize_deploy_native_capture_tmp
  no_log: true

- name: Capture native private helper output without streaming values
  block:
    - name: Execute the private helper into its result file
      ansible.builtin.shell:
        cmd: >-
          {{ cifmw_kustomize_deploy_native_capture_argv | map('quote') | join(' ') }}
          > {{ cifmw_kustomize_deploy_native_capture_tmp.path | quote }}
      register: cifmw_kustomize_deploy_native_capture_command
      changed_when: false
      failed_when: false
      no_log: true

    - name: Read the private helper result
      ansible.builtin.slurp:
        src: "{{ cifmw_kustomize_deploy_native_capture_tmp.path }}"
      register: cifmw_kustomize_deploy_native_capture_data
      no_log: true

    - name: Expose the protected helper result to the role
      ansible.builtin.set_fact:
        cifmw_kustomize_deploy_native_capture_result: >-
          {{ {'rc': cifmw_kustomize_deploy_native_capture_command.rc | int,
              'stdout': cifmw_kustomize_deploy_native_capture_data.content | b64decode | trim} }}
      no_log: true
  always:
    - name: Remove the private native helper result file
      ansible.builtin.file:
        path: "{{ cifmw_kustomize_deploy_native_capture_tmp.path }}"
        state: absent
      no_log: true
