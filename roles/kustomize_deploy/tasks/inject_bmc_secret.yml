# Replace the bmc-secret CHANGEME placeholder (shipped by the architecture
# repo's baremetalhosts bmc-secret.env secretGenerator) with the real
# sushy-emulator Redfish credentials, so the metal3/ironic client authenticates
# to the Redfish BMC with the same credentials the sushy-emulator server was
# configured with.
#
# The credentials originate from the Zuul secret `sushy_emulator_vbmc_creds`
# (components-integration-config), which the cic pre-run decrypts and
# materializes to a flat username/password file. For scenarios that use the
# sushy emulator (e.g. bmo01) the reproducer copies that file onto the deploy
# host via cifmw_manage_secrets_reproducer_secrets, landing it at
# "{{ cifmw_basedir }}/secrets/sushy_emulator_vbmc_access.yaml". We slurp it
# here and patch bmc-secret to match.
#
# This task reads ONLY the flat file - never cifmw_redfish_* - so it is immune
# to any scenario that leaves cifmw_redfish_* as a dangling reference, and it
# stays a safe no-op for every job that does not ship the file (real-hardware
# jobs keep their own iDRAC/iLO bmc-secret untouched). osp_secret_manifest.py
# "set" is additionally a no-op when the manifest has no bmc-secret.

- name: Populate bmc-secret from the sushy emulator Redfish credentials
  vars:
    _nolog: "{{ cifmw_nolog | default(true) | bool }}"
    _bmc_creds_file: >-
      {{
        cifmw_kustomize_deploy_bmc_creds_file |
        default((cifmw_basedir, 'secrets',
                 'sushy_emulator_vbmc_access.yaml') | path_join)
      }}
  no_log: "{{ _nolog }}"
  block:
    - name: Check for the sushy emulator Redfish credentials file
      ansible.builtin.stat:
        path: "{{ _bmc_creds_file }}"
      register: _bmc_creds_stat

    - name: Inject the credentials into bmc-secret when the file is present
      when: _bmc_creds_stat.stat.exists
      block:
        - name: Read the sushy emulator Redfish credentials
          ansible.builtin.slurp:
            src: "{{ _bmc_creds_file }}"
          register: _bmc_creds_raw

        - name: Set the bmc-secret credentials fact
          ansible.builtin.set_fact:
            _bmc_creds: "{{ _bmc_creds_raw.content | b64decode | from_yaml }}"

        - name: Create temporary bmc-secret keys file
          ansible.builtin.tempfile:
            state: file
            suffix: .bmc-secret-keys.json
          register: _bmc_secret_keys_file

        - name: Write keys and set bmc-secret, always removing the temp file
          block:
            - name: Write bmc-secret keys
              ansible.builtin.copy:
                dest: "{{ _bmc_secret_keys_file.path }}"
                content: >-
                  {{ {"username": _bmc_creds.username,
                      "password": _bmc_creds.password} | to_json }}
                mode: "0600"

            - name: Set bmc-secret keys in kustomize manifest
              ansible.builtin.command:
                argv:
                  - python3
                  - "{{ role_path }}/files/osp_secret_manifest.py"
                  - set
                  - "{{ cifmw_kustomize_deploy_manifest_path }}"
                  - "{{ _bmc_secret_keys_file.path }}"
                  - bmc-secret
              register: _set_bmc_secret
              changed_when: "'Set:' in _set_bmc_secret.stdout"
          always:
            # Ensures the plaintext BMC credentials never linger on disk, even
            # if the write or the set command above fails.
            - name: Remove temporary bmc-secret keys file
              ansible.builtin.file:
                path: "{{ _bmc_secret_keys_file.path }}"
                state: absent
