# Randomize the libvirt-secret (LibvirtPassword) coming from the
# architecture repo's lib/dataplane/nodeset libvirt-secret.env, which
# hardcodes a well-known default password. Only present in the dataplane
# manifest, so this is a no-op for every other stage.

- name: Ensure libvirt-secret password is randomized in kustomize manifest
  vars:
    _libvirt_secret_name: libvirt-secret
    _nolog: "{{ cifmw_nolog | default(true) | bool }}"
  block:
    - name: Check whether kustomize output contains libvirt-secret
      ansible.builtin.command:
        argv:
          - python3
          - "{{ role_path }}/files/osp_secret_manifest.py"
          - has
          - "{{ cifmw_kustomize_deploy_manifest_path }}"
          - "{{ _libvirt_secret_name }}"
      register: _libvirt_secret_manifest_check
      changed_when: false
      # rc 0 = found, rc 1 = not found (both fine, handled below). Any other
      # rc means the manifest could not be read/parsed: fail loudly instead
      # of silently skipping randomization of a possibly-default password.
      failed_when: _libvirt_secret_manifest_check.rc not in [0, 1]

    - name: Randomize libvirt-secret password
      when: _libvirt_secret_manifest_check.rc == 0
      block:
        - name: Read libvirt-secret namespace from kustomize manifest
          ansible.builtin.command:
            argv:
              - python3
              - "{{ role_path }}/files/osp_secret_manifest.py"
              - get-namespace
              - "{{ cifmw_kustomize_deploy_manifest_path }}"
              - "{{ _libvirt_secret_name }}"
          register: _manifest_libvirt_secret_namespace
          changed_when: false
          failed_when: false

        - name: Set libvirt-secret namespace for cluster lookup
          ansible.builtin.set_fact:
            _libvirt_secret_namespace: >-
              {{
                _manifest_libvirt_secret_namespace.stdout
                if _manifest_libvirt_secret_namespace.rc == 0 and
                   (_manifest_libvirt_secret_namespace.stdout | length > 0)
                else cifmw_openstack_namespace
              }}

        - name: Get existing libvirt-secret from cluster
          when: not cifmw_kustomize_deploy_generate_crs_only | bool
          kubernetes.core.k8s_info:
            kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
            api_key: "{{ cifmw_openshift_token | default(omit) }}"
            context: "{{ cifmw_openshift_context | default(omit) }}"
            api_version: v1
            kind: Secret
            name: "{{ _libvirt_secret_name }}"
            namespace: "{{ _libvirt_secret_namespace }}"
          register: _existing_libvirt_secret
          no_log: "{{ _nolog }}"

        - name: Build cluster secret values dict for libvirt-secret randomizer
          vars:
            _raw_data: >-
              {{
                _existing_libvirt_secret.resources[0].data
                if (_existing_libvirt_secret.resources | default([]) | length > 0)
                else {}
              }}
          ansible.builtin.set_fact:
            _cluster_values_for_libvirt_randomize: >-
              {% set result = {} -%}
              {% for key, val in _raw_data.items() -%}
              {%   set _ = result.update({key: val | b64decode}) -%}
              {% endfor -%}
              {{ result }}
          no_log: "{{ _nolog }}"

        - name: Create temporary libvirt-secret randomize config file
          ansible.builtin.tempfile:
            state: file
            suffix: .libvirt-secret-randomize.json
          register: _libvirt_randomize_config_file
          no_log: "{{ _nolog }}"

        - name: Write config and randomize libvirt-secret key, always removing the temp file
          block:
            - name: Write libvirt-secret randomize config
              ansible.builtin.copy:
                dest: "{{ _libvirt_randomize_config_file.path }}"
                content: >-
                  {{
                    {
                      "cluster_values": _cluster_values_for_libvirt_randomize
                    } | to_json
                  }}
                mode: "0600"
              no_log: "{{ _nolog }}"

            - name: Randomize libvirt-secret key in kustomize manifest
              ansible.builtin.command:
                argv:
                  - python3
                  - "{{ role_path }}/files/osp_secret_manifest.py"
                  - randomize
                  - "{{ cifmw_kustomize_deploy_manifest_path }}"
                  - "{{ _libvirt_randomize_config_file.path }}"
                  - "{{ _libvirt_secret_name }}"
              register: _randomize_libvirt_secret
              changed_when: "'Randomized:' in _randomize_libvirt_secret.stdout"
              no_log: "{{ _nolog }}"
          always:
            # Ensures the plaintext cluster secret never lingers on disk,
            # even if the write or the randomize command above fails.
            - name: Remove temporary libvirt-secret randomize config file
              ansible.builtin.file:
                path: "{{ _libvirt_randomize_config_file.path }}"
                state: absent
              no_log: "{{ _nolog }}"
