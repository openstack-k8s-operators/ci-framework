# Replaces hardcoded default values in the architecture repo's
# osp-secrets.env with randomly generated ones before kustomize builds
# the K8s Secret.  Uses a three-tier resolution per key:
#   1. Live cluster osp-secret (preserves existing deployed values)
#   2. Local cache from a previous run
#   3. Generate a new random value

- name: Randomize osp-secrets.env values
  vars:
    _osp_secrets_path: >-
      {{
        (cifmw_kustomize_deploy_architecture_repo_dest_dir,
         cifmw_kustomize_deploy_osp_secrets_env_path) | path_join
      }}
  block:
    - name: Check if osp-secrets.env exists
      register: _osp_secrets_stat
      ansible.builtin.stat:
        path: "{{ _osp_secrets_path }}"
        get_attributes: false
        get_checksum: false
        get_mime: false

    - name: Randomize secret values in osp-secrets.env
      when: _osp_secrets_stat.stat.exists
      block:
        - name: Attempt to read live osp-secret from cluster
          register: _cluster_osp_secret
          failed_when: false
          no_log: true
          kubernetes.core.k8s_info:
            kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
            api_key: "{{ cifmw_openshift_token | default(omit) }}"
            context: "{{ cifmw_openshift_context | default(omit) }}"
            api_version: v1
            kind: Secret
            name: osp-secret
            namespace: "{{ cifmw_openstack_namespace }}"

        - name: Build dict of cluster secret values
          no_log: true
          vars:
            _raw_data: >-
              {{
                _cluster_osp_secret.resources[0].data
                if (_cluster_osp_secret.resources | default([]) | length > 0)
                else {}
              }}
          ansible.builtin.set_fact:
            _cluster_secrets: >-
              {% set result = {} -%}
              {% for key, val in _raw_data.items() -%}
              {%   set _ = result.update({key: val | b64decode}) -%}
              {% endfor -%}
              {{ result }}

        - name: Check if local secrets cache exists
          register: _cache_stat
          ansible.builtin.stat:
            path: "{{ cifmw_kustomize_deploy_osp_secrets_cache_path }}"
            get_attributes: false
            get_checksum: false
            get_mime: false

        - name: Read local secrets cache
          when: _cache_stat.stat.exists
          register: _cache_raw
          no_log: true
          ansible.builtin.slurp:
            path: "{{ cifmw_kustomize_deploy_osp_secrets_cache_path }}"

        - name: Build dict of cached secret values
          no_log: true
          vars:
            _cache_content: >-
              {{ (_cache_raw.content | b64decode)
                 if (_cache_stat.stat.exists and _cache_raw is defined)
                 else '' }}
          ansible.builtin.set_fact:
            _cached_secrets: >-
              {% set result = {} -%}
              {% for line in _cache_content.splitlines() -%}
              {%   set trimmed = line | trim -%}
              {%   if '=' in trimmed and not trimmed.startswith('#') and trimmed | length > 0 -%}
              {%     set _ = result.update({trimmed.split('=', 1)[0]: trimmed.split('=', 1)[1]}) -%}
              {%   endif -%}
              {% endfor -%}
              {{ result }}

        - name: Read osp-secrets.env
          register: _osp_secrets_raw
          ansible.builtin.slurp:
            path: "{{ _osp_secrets_path }}"

        - name: Generate randomized osp-secrets.env content
          no_log: true
          vars:
            _original: "{{ _osp_secrets_raw.content | b64decode }}"
            _newline: "\n"
            _special: "{{ cifmw_kustomize_deploy_osp_secrets_special_keys }}"
            _skip: "{{ cifmw_kustomize_deploy_osp_secrets_skip_keys }}"
            _cluster: "{{ _cluster_secrets }}"
            _cache: "{{ _cached_secrets }}"
          ansible.builtin.set_fact:
            _osp_secrets_randomized: >-
              {% set output = [] -%}
              {% for line in _original.splitlines() -%}
              {%   set trimmed = line | trim -%}
              {%   if '=' in trimmed and not trimmed.startswith('#') and trimmed | length > 0 -%}
              {%     set key = trimmed.split('=', 1)[0] -%}
              {%     if key in _skip -%}
              {%       set _ = output.append(line) -%}
              {%     elif key in _cluster -%}
              {%       set _ = output.append(key ~ '=' ~ _cluster[key]) -%}
              {%     elif key in _cache -%}
              {%       set _ = output.append(key ~ '=' ~ _cache[key]) -%}
              {%     elif key in _special and _special[key].type == 'base64' -%}
              {%       set new_val = lookup('password', '/dev/null length=' ~ _special[key].length ~ ' chars=ascii_letters,digits') | b64encode -%}
              {%       set _ = output.append(key ~ '=' ~ new_val) -%}
              {%     elif key in _special and _special[key].type == 'hex' -%}
              {%       set new_val = lookup('password', '/dev/null length=' ~ (_special[key].length * 2) ~ ' chars=hexdigits') | lower -%}
              {%       set _ = output.append(key ~ '=' ~ new_val) -%}
              {%     else -%}
              {%       set new_val = lookup('password', '/dev/null length=20 chars=ascii_letters,digits') -%}
              {%       set _ = output.append(key ~ '=' ~ new_val) -%}
              {%     endif -%}
              {%   else -%}
              {%     set _ = output.append(line) -%}
              {%   endif -%}
              {% endfor -%}
              {{ output | join(_newline) }}

        - name: Write randomized osp-secrets.env
          no_log: true
          ansible.builtin.copy:
            backup: true
            content: "{{ _osp_secrets_randomized }}\n"
            dest: "{{ _osp_secrets_path }}"
            mode: "0644"

        - name: Save generated secrets to local cache
          no_log: true
          ansible.builtin.copy:
            content: "{{ _osp_secrets_randomized }}\n"
            dest: "{{ cifmw_kustomize_deploy_osp_secrets_cache_path }}"
            mode: "0600"
