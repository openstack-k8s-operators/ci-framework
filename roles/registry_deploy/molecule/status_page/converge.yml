---
# Contract test for the content provider status page publication, mirroring
# the s2i-openstack-containers provider-contract scenario. It exercises the
# real task file from ci/playbooks/tasks/ (reached via the repository root,
# molecule has no playbook-level scenarios in this repository) and verifies
# the building-to-ready document transitions, including the atomic
# publication (no partially written document is ever observable).
- name: Converge
  hosts: all
  vars:
    cifmw_test_repo_root: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../.."
    cifmw_test_status_dir: "{{ ansible_user_dir }}/zuul-output/.cifmw-status"
    cifmw_test_building_status:
      status: building
      registry: registry.test:5001
      zuul_change: "1234"
      zuul_patchset: "5"
    cifmw_test_ready_status:
      status: ready
      registry: registry.test:5001
      cifmw_build_images_output:
        images:
          edpm-hardened-uefi:
            image: registry.test:5001/edpm-hardened-uefi:test
      content_provider_registry_available: true
      content_provider_registry_ip: registry.test
      content_provider_registry_ip_port: registry.test:5001
  tasks:
    - name: Create the content status fixture directory
      ansible.builtin.file:
        path: "{{ cifmw_test_status_dir }}"
        state: directory
        mode: "0755"

    - name: Publish the building content status document
      vars:
        cifmw_content_provider_status_dir: "{{ cifmw_test_status_dir }}"
        cifmw_content_provider_status: "{{ cifmw_test_building_status }}"
      ansible.builtin.include_tasks: >-
        {{ cifmw_test_repo_root }}/ci/playbooks/tasks/publish-content-status.yaml

    - name: Read the building content status document
      ansible.builtin.slurp:
        src: "{{ cifmw_test_status_dir }}/content.json"
      register: cifmw_test_building_document

    - name: Require the building content status document
      ansible.builtin.assert:
        that:
          - cifmw_test_building_document.content | b64decode | from_json == cifmw_test_building_status
        fail_msg: The building content status document is malformed

    - name: Publish the ready content status document
      vars:
        cifmw_content_provider_status_dir: "{{ cifmw_test_status_dir }}"
        cifmw_content_provider_status: "{{ cifmw_test_ready_status }}"
      ansible.builtin.include_tasks: >-
        {{ cifmw_test_repo_root }}/ci/playbooks/tasks/publish-content-status.yaml

    - name: Read the ready content status document
      ansible.builtin.slurp:
        src: "{{ cifmw_test_status_dir }}/content.json"
      register: cifmw_test_ready_document

    - name: Require the ready content status document
      ansible.builtin.assert:
        that:
          - cifmw_test_ready_document.content | b64decode | from_json == cifmw_test_ready_status
        fail_msg: The ready content status document is malformed
