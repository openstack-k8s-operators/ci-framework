# Namespace holding the OpenStackDataPlaneNodeSet resources.
cifmw_edpm_satellite_register_namespace: openstack

# Name of the nodeset whose edpm_bootstrap_command should be appended to.
cifmw_edpm_satellite_register_nodeset_name: openstack-edpm

# The Satellite global-registration command (curl ... | bash) to append to the
# existing edpm_bootstrap_command. Sourced from the Satellite registration API
# (see rhos-qe-jenkins infra/satellite prepare_deployment_data.yml). Required.
cifmw_edpm_satellite_register_command: ""

# When true, compute the patched command but do not patch the nodeset.
cifmw_edpm_satellite_register_dry_run: false
