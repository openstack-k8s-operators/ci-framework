- name: Debug _secret_dest
  ansible.builtin.debug:
    var: _secret_dest

- name: Debug _secret_file
  ansible.builtin.debug:
    var: _secret_file

- name: Debug _secret_content
  no_log: "{{ cifmw_nolog | default(true) | bool }}"
  ansible.builtin.debug:
    var: _secret_content

- name: Manage file copy
  when:
    - _secret_file != None
    - _secret_file | length > 0
  block:
    - name: Ensure parameter is an absolute path
      ansible.builtin.assert:
        that:
          - _secret_file is ansible.builtin.abs
        msg: |
          {{ _secret_file }} must be an absolute path

    - name: Check if pull secret src file exists
      ansible.builtin.stat:
        path: "{{ _secret_file }}"
      register: _ps_exists
      ignore_errors: true

    - name: Copy file to location
      when: >-
        _ps_exists.stat.exists | default(false) or
        not (cifmw_reproducer_native_creation | default(false) | bool)
      ansible.builtin.copy:
        remote_src: "{{ _ps_exists.stat.exists | default(false) }}"
        dest: "{{ _secret_dest }}"
        src: "{{ _secret_file }}"
        mode: "0600"
        owner: "{{ cifmw_manage_secrets_owner }}"

    # In native creation the control node is the executor, which does not
    # carry the job secrets: read them from the source build node instead.
    - name: Push secret from the source build node
      when:
        - not _ps_exists.stat.exists | default(false)
        - cifmw_reproducer_native_creation | default(false) | bool
      block:
        - name: Read secret from the source build node
          delegate_to: "{{ cifmw_reproducer_native_source_host }}"
          ansible.builtin.slurp:
            src: "{{ _secret_file }}"
          register: _ps_native  # noqa: var-naming[pattern]
          no_log: true

        - name: Write secret to destination
          ansible.builtin.copy:
            dest: "{{ _secret_dest }}"
            content: "{{ _ps_native.content | b64decode }}"
            mode: "0600"
            owner: "{{ cifmw_manage_secrets_owner }}"
          no_log: true

- name: Manage file creation from content
  when:
    - _secret_content != None
    - _secret_content | length > 0
  block:
    - name: Create file from content
      no_log: "{{ cifmw_nolog | default(true) | bool }}"
      ansible.builtin.copy:
        dest: "{{ _secret_dest }}"
        content: "{{ _secret_content }}"
        mode: "0600"
        owner: "{{ cifmw_manage_secrets_owner }}"
