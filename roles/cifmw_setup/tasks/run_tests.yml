---
- name: Run pre_tests hooks
  vars:
    step: pre_tests
  ansible.builtin.import_role:
    name: run_hook

# Fails fast, before the long test run, if a public endpoint is not reachable
# from this node, is not served as expected, or presents the wrong certificate.
- name: Validate the public endpoints
  vars:
    step: validate_public_endpoints
    hooks:
      - name: Validate the public endpoints
        type: playbook
        source: public_endpoints_validate.yml
  ansible.builtin.import_role:
    name: run_hook
  when:
    - cifmw_run_tests | default(false) | bool
    - cifmw_setup_validate_public_endpoints | bool

- name: Run tests
  tags:
    - tests
  ansible.builtin.import_role:
    name: "{{ cifmw_run_test_role | default('test_operator') }}"
  when: cifmw_run_tests | default(false) | bool

- name: Run post_tests hooks
  vars:
    step: post_tests
  ansible.builtin.import_role:
    name: run_hook
  when: cifmw_run_tests | default(false) | bool
