---
- name: Load controller-local parameters in the legacy control context
  when: not cifmw_reproducer_native_deployment | default(false) | bool
  ansible.builtin.include_vars:
    dir: "{{ cifmw_basedir }}/artifacts/parameters"

- name: Load controller parameters from the remote native target
  when: cifmw_reproducer_native_deployment | default(false) | bool
  vars:
    included_dir: "{{ cifmw_basedir }}/artifacts/parameters"
  ansible.builtin.include_role:
    name: cifmw_helpers
    tasks_from: include_dir.yml
