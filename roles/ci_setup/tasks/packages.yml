---
- name: List packages to install
  tags:
    - bootstrap
    - packages
  ansible.builtin.debug:
    var: cifmw_ci_setup_packages

- name: Disable rhos-release generated repos on RHEL 10+
  when:
    - cifmw_repo_setup_rhos_release_rpm is defined
  tags:
    - bootstrap
    - packages
  block:
    # ansible_* under delegate_to is evaluated from the inventory host, not
    # the connection target (e.g. reproducer runs this role on controller-0
    # via a delegate_to block, but ansible_distribution* still reflects the
    # hypervisor). Read ID/VERSION_ID from the actual target instead of
    # relying on those facts.
    - name: Detect OS ID on the target host
      ansible.builtin.command:
        argv:
          - awk
          - -F=
          - /^ID=/ { gsub(/"/, "", $2); print $2 }
          - /etc/os-release
      register: _cifmw_ci_setup_os_id
      changed_when: false
      failed_when: >-
        _cifmw_ci_setup_os_id.rc != 0 or
        _cifmw_ci_setup_os_id.stdout | trim | length == 0

    - name: Detect OS VERSION_ID on the target host
      ansible.builtin.command:
        argv:
          - awk
          - -F=
          - /^VERSION_ID=/ { gsub(/"/, "", $2); print $2 }
          - /etc/os-release
      register: _cifmw_ci_setup_os_version_id
      changed_when: false
      failed_when: >-
        _cifmw_ci_setup_os_version_id.rc != 0 or
        _cifmw_ci_setup_os_version_id.stdout | trim | length == 0

    - name: Disable all rhos-release generated repos
      when:
        - (_cifmw_ci_setup_os_id.stdout | trim) == 'rhel'
        - ((_cifmw_ci_setup_os_version_id.stdout | trim).split('.') | first | int) >= 10
      become: true
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          for f in /etc/yum.repos.d/delorean.repo
          /etc/yum.repos.d/osp-trunk*.repo; do
            [ -f "$f" ] || continue;
            case "$f" in *rhos-release-ceph*) continue ;; esac;
            sed -i 's/^enabled=1/enabled=0/' "$f";
          done

- name: Install needed packages  # noqa: package-latest
  become: true
  tags:
    - bootstrap
    - packages
  ansible.builtin.package:
    name: "{{ cifmw_ci_setup_packages }}"
    state: latest

- name: Gather version of openshift client
  register: _oc_version
  environment: >-
    {{
      {'PATH': cifmw_path}
      if cifmw_path is defined else
      {}
    }}
  ansible.builtin.command:
    cmd: "oc version --client -o yaml"
  changed_when: false
  failed_when: false

- name: Install openshift client
  tags:
    - bootstrap
    - packages
  when: >-
    _oc_version.rc != 0 or
    (
      ((_oc_version.stdout | from_yaml).releaseClientVersion | split('.') | first | int) >=
      cifmw_ci_setup_openshift_minimum_version
    )
  block:
    - name: Ensure openshift client install path is present
      ansible.builtin.file:
        path: "{{ cifmw_ci_setup_oc_install_path }}"
        state: directory
        mode: "0755"

    - name: Install openshift client
      ansible.builtin.unarchive:
        src: "{{ cifmw_ci_setup_openshift_client_download_uri }}/{{ cifmw_ci_setup_openshift_client_version }}/openshift-client-linux.tar.gz"
        dest: "{{ cifmw_ci_setup_oc_install_path }}"
        remote_src: true
        mode: "0755"
        creates: "{{ cifmw_ci_setup_oc_install_path }}/oc"

- name: Add the OC path to cifmw_path if needed
  vars:
    _cifmw_paths_list: >-
      {{
        cifmw_path | split(':')
        if cifmw_path is defined else []
      }}
  when: cifmw_ci_setup_oc_install_path not in _cifmw_paths_list
  ansible.builtin.set_fact:
    cifmw_path: "{{ cifmw_ci_setup_oc_install_path }}:{{ ansible_env.PATH }}"
    cacheable: true

- name: Inject oc completion in local profile
  block:
    - name: Create completion file
      ansible.builtin.shell:  # noqa: risky-shell-pipe
        cmd: >-
          {{ cifmw_ci_setup_oc_install_path }}/oc completion bash |
          tee -a ~/.oc_completion
        creates: "{{ ansible_user_dir }}/.oc_completion"
      no_log: "{{ cifmw_nolog | default(true) | bool }}"

    - name: Source completion from within .bashrc
      ansible.builtin.blockinfile:
        create: true
        mode: "0644"
        path: "{{ ansible_user_dir }}/.bashrc"
        block: |-
          if [ -f ~/.oc_completion ]; then
            source ~/.oc_completion
          fi
