---
cifmw_ci_setup_packages:
  # Ansible is provisioned through pip; an RPM can overwrite its
  # running installation with an older version from the OpenStack repositories.
  - bash-completion
  - ca-certificates
  - git-core
  - make
  - tar
  - tmux
  # kustomize_deploy generates the Barbican Fernet key with the system
  # interpreter; the removed ansible-core RPM used to pull it in.
  - python3-cryptography
  - python3-pip
  - python3.12
  - python3.12-pip
  # bm_sno reaches iDRAC over password SSH; the removed ansible-core
  # RPM used to pull it in as well.
  - sshpass

cifmw_ci_setup_rhel_rhsm_default_repos:
  - 'rhel-*-baseos-rpms'
  - 'rhel-*-appstream-rpms'
  - 'codeready-builder-*-x86_64-rpms'
