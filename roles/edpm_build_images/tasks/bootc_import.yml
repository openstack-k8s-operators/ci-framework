---
- name: Pull published bootc image into root container storage
  become: true
  ansible.builtin.command:
    argv:
      - podman
      - pull
      - "--tls-verify={{ cifmw_edpm_build_images_bootc_source_tls_verify | bool | lower }}"
      - "{{ cifmw_edpm_build_images_bootc_source_image }}"

- name: Tag published bootc image for qcow2 generation and publication
  become: true
  ansible.builtin.command:
    argv:
      - podman
      - tag
      - "{{ cifmw_edpm_build_images_bootc_source_image }}"
      - "localhost/edpm-bootc:{{ cifmw_edpm_build_images_tag }}"
