---
- name: Merge an override with the existing framework utility
  ansible.builtin.command:
    argv:
      - python3
      - "{{ cifmw_reproducer_native_vars_dir.path }}/merge_yaml_override.py"
      - "{{ cifmw_reproducer_native_vars_dir.path }}/merged.yml"
      - "{{ cifmw_reproducer_native_override_file }}"
      - "{{ cifmw_reproducer_native_vars_dir.path }}/next.yml"
  register: cifmw_reproducer_native_merge_result
  changed_when: false
  no_log: true

- name: Store the merged parameter file without relying on command stdout
  ansible.builtin.copy:
    src: "{{ cifmw_reproducer_native_vars_dir.path }}/next.yml"
    dest: "{{ cifmw_reproducer_native_vars_dir.path }}/merged.yml"
    remote_src: true
    mode: "0600"
  no_log: true
