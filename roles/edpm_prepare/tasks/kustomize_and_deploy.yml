- name: Controlplane name
  ansible.builtin.set_fact:
    _ctlplane_name: "controlplane"

- name: Set vars related to update_containers content provider
  when:
    - content_provider_os_registry_url is defined
    - content_provider_os_registry_url != 'null'
  ansible.builtin.set_fact:
    cifmw_update_containers_registry: "{{ content_provider_os_registry_url  | split('/') | first }}"
    cifmw_update_containers_org: "{{ content_provider_os_registry_url  | split('/') | last }}"
    cifmw_update_containers_tag: "{{ content_provider_dlrn_md5_hash | default(cifmw_default_container_image_tag, true) }}"
    cifmw_update_containers_openstack: true

- name: Controlplane name kustomization
  ansible.builtin.set_fact:
    _ctlplane_name_kustomizations:
      - apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization
        patches:
          - target:
              kind: OpenStackControlPlane
            patch: |-
              - op: replace
                path: /metadata/name
                value: {{ _ctlplane_name }}

- name: Perform kustomizations to the OpenStackControlPlane CR
  vars:
    cifmw_edpm_prepare_openstack_crs_path: >-
      {{
        [
          cifmw_edpm_prepare_manifests_dir,
          cifmw_install_yamls_defaults['NAMESPACE'],
          'openstack',
          'cr'
        ] | ansible.builtin.path_join
      }}
  cifmw.general.ci_kustomize:
    target_path: "{{ cifmw_edpm_prepare_openstack_crs_path }}"
    sort_ascending: false
    kustomizations: >-
      {{
        cifmw_edpm_prepare_kustomizations +
        _ctlplane_name_kustomizations +
        (cifmw_edpm_prepare_extra_kustomizations | default([]))
      }}
    kustomizations_paths: >-
      {{
        [
          (
            [
              cifmw_edpm_prepare_manifests_dir,
              'kustomizations',
              'controlplane'
            ] | ansible.builtin.path_join
          )
        ]
      }}
  register: cifmw_edpm_prepare_crs_kustomize_result

- name: Log the CR that is about to be applied
  ansible.builtin.debug:
    var: cifmw_edpm_prepare_crs_kustomize_result

# Runs after kustomize (so backends injected via kustomizations are visible) and
# before the OSCP apply (so the OpenStackVersion custom images are seeded first).
- name: Prepare OpenStackVersion CR
  when: >-
      (cifmw_prepare_openstackversion | bool) and
      ((cifmw_update_containers_edpm_image_url is defined and
      cifmw_update_containers_openstack is defined and
      cifmw_update_containers_openstack | bool) or
      (cifmw_update_containers_ansibleee_image_url is defined) or
      (cifmw_update_containers_openstack is defined and
      cifmw_update_containers_openstack | bool) or
      (cifmw_update_containers_custom_images is defined and
      cifmw_update_containers_custom_images is mapping) or
      (cifmw_update_containers_watcher is defined and
      cifmw_update_containers_watcher | bool) or
      (cifmw_update_containers_ceilometersgcoreImage is defined) or
      (cifmw_update_containers_ceilometermysqldexporterImage is defined) or
       (cifmw_update_containers_edpmpodmanexporterImage is defined) or
       ((cifmw_set_containers_images | default([])) | length > 0))
  block:
    - name: Derive cinder/manila backend names from the control plane CR
      # Migration fallback: callers still passing cifmw_update_containers_cindervolumes /
      # cifmw_update_containers_manilashares (e.g. component jobs) keep working until they
      # migrate to the cifmw_edpm_prepare_* variables.
      vars:
        _ctlplane_spec: >-
          {{
            ((lookup('file', cifmw_edpm_prepare_crs_kustomize_result.output_path)
              | from_yaml_all | selectattr('kind', 'equalto', 'OpenStackControlPlane')
              | map(attribute='spec') | list) + [{}]) | first
          }}
      ansible.builtin.set_fact:
        cifmw_edpm_prepare_cindervolumes: >-
          {{
            (cifmw_edpm_prepare_cindervolumes | default(cifmw_update_containers_cindervolumes | default([])))
            or (((_ctlplane_spec.get('cinder') or {}).get('template') or {}).get('cinderVolumes') | default({}, true) | list)
          }}
        cifmw_edpm_prepare_manilashares: >-
          {{
            (cifmw_edpm_prepare_manilashares | default(cifmw_update_containers_manilashares | default([])))
            or (((_ctlplane_spec.get('manila') or {}).get('template') or {}).get('manilaShares') | default({}, true) | list)
          }}

    - name: Generate the OpenStackVersion CR with custom images
      cifmw.general.set_containers:
        dest_path: >-
          {{
            cifmw_set_containers_dest_path | default(
              (cifmw_basedir, 'artifacts', 'manifests', 'set_containers.yml') |
              ansible.builtin.path_join
            )
          }}
        metadata_name: "{{ _ctlplane_name }}"
        namespace: "{{ cifmw_update_containers_namespace | default('openstack') }}"
        preserve_unlisted: "{{ cifmw_set_containers_preserve_unlisted | default(true) | bool }}"
        registry: >-
          {{
            cifmw_set_containers_registry |
            default(cifmw_update_containers_registry | default(cifmw_default_registry))
          }}
        org: >-
          {{
            cifmw_set_containers_org |
            default(cifmw_update_containers_org | default(cifmw_default_container_image_namespace))
          }}
        tag: >-
          {{
            cifmw_set_containers_tag |
            default(cifmw_update_containers_tag | default(cifmw_default_container_image_tag))
          }}
        include_openstack: >-
          {{
            cifmw_set_containers_include_openstack |
            default(cifmw_update_containers_openstack | default(false)) | bool
          }}
        apply: >-
          {{
            cifmw_set_containers_apply |
            default(cifmw_update_containers | default(false)) | bool
          }}
        kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
        images: >-
          {%- set _custom_images = [] -%}
          {%- for _image_name, _image_uri in (cifmw_update_containers_custom_images | default({})).items() -%}
          {%- set _ = _custom_images.append({'name': _image_name, 'full_registry': _image_uri}) -%}
          {%- endfor -%}
          {%- set _explicit_names = (cifmw_set_containers_images | default([])) | map(attribute='name') | list -%}
          {{
            (cifmw_set_containers_images | default([])) +
            _custom_images +
            (
              [{'name': 'cinderVolumeImages', 'container_suffix': 'cinder-volume', 'backends': cifmw_edpm_prepare_cindervolumes}]
              if (cifmw_edpm_prepare_cindervolumes and 'cinderVolumeImages' not in _explicit_names) else []
            ) +
            (
              [{'name': 'manilaShareImages', 'container_suffix': 'manila-share', 'backends': cifmw_edpm_prepare_manilashares}]
              if (cifmw_edpm_prepare_manilashares and 'manilaShareImages' not in _explicit_names) else []
            ) +
            (
              [{'name': 'osContainerImage', 'full_registry': cifmw_update_containers_edpm_image_url}]
              if cifmw_update_containers_edpm_image_url is defined else []
            ) +
            (
              [{'name': 'ironicPythonAgentImage', 'full_registry': cifmw_update_containers_ipa_image_url}]
              if cifmw_update_containers_ipa_image_url is defined else []
            ) +
            (
              [{'name': 'ansibleeeImage', 'full_registry': cifmw_update_containers_ansibleee_image_url}]
              if cifmw_update_containers_ansibleee_image_url is defined else []
            ) +
            (
              [{'name': 'ceilometerSgcoreImage', 'full_registry': cifmw_update_containers_ceilometersgcoreImage}]
              if cifmw_update_containers_ceilometersgcoreImage is defined else []
            ) +
            (
              [{'name': 'ceilometerMysqldExporterImage', 'full_registry': cifmw_update_containers_ceilometermysqldexporterImage}]
              if cifmw_update_containers_ceilometermysqldexporterImage is defined else []
            ) +
            (
              [{'name': 'edpmPodmanExporterImage', 'full_registry': cifmw_update_containers_edpmpodmanexporterImage}]
              if cifmw_update_containers_edpmpodmanexporterImage is defined else []
            ) +
            (
              [
                {'name': 'watcherAPIImage', 'container_suffix': 'watcher-api'},
                {'name': 'watcherApplierImage', 'container_suffix': 'watcher-applier'},
                {'name': 'watcherDecisionEngineImage', 'container_suffix': 'watcher-decision-engine'}
              ]
              if (cifmw_update_containers_watcher | default(false) | bool) else []
            )
          }}

- name: Apply the OpenStackControlPlane CR
  environment:
    KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
    PATH: "{{ cifmw_path }}"
  cifmw.general.ci_script:
    output_dir: "{{ cifmw_edpm_prepare_basedir }}/artifacts"
    script: "oc apply -f {{ cifmw_edpm_prepare_crs_kustomize_result.output_path }}"

- name: Wait for control plane to change its status
  # If we are modifying the control plane, it can be in a 'ready' status, so
  # we need to wait a few seconds so it changes to a 'non-ready' status first.
  ansible.builtin.pause:
    seconds: "{{ cifmw_edpm_prepare_wait_controplane_status_change_sec }}"

- name: Wait for OpenStack controlplane to be deployed
  environment:
    KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
    PATH: "{{ cifmw_path }}"
  ansible.builtin.command:
    cmd: >-
      oc wait OpenStackControlPlane {{ _ctlplane_name }}
      --namespace={{ cifmw_install_yamls_defaults['NAMESPACE'] }}
      --for=condition=ready
      --timeout={{ cifmw_edpm_prepare_timeout }}m
