cifmw_cleanup_openstack_detach_bmh: true
# Seconds to wait for the operator CRs and the OpenStack namespace to be removed
# before giving up and force-draining a namespace stuck in "Terminating". Kept
# short so the recovery (strip leftover finalizers + retry) kicks in quickly
# instead of burning the full default deletion timeout.
cifmw_cleanup_openstack_operators_wait_timeout: 300
