---
- name: "Ensure resources are removed - {{ cifmw_cleanup_resource.kind }}"
  block:
    - name: "Wait for resource to be deleted - {{ cifmw_cleanup_resource.kind }}"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
        api_key: "{{ cifmw_openshift_token | default(omit) }}"
        context: "{{ cifmw_openshift_context | default(omit) }}"
        namespace: "{{ cifmw_openstack_namespace }}"
        kind: "{{ cifmw_cleanup_resource.kind }}"
        api_version: "{{ cifmw_cleanup_resource.api_version }}"
      register: cifmw_cleanup_resource_result
      until: cifmw_cleanup_resource_result.resources | default([]) | length == 0
      retries: 60
      delay: 10
  rescue:
    - name: "Force-remove finalizers from stuck resource - {{ cifmw_cleanup_resource.kind }}"
      ansible.builtin.include_tasks: strip_finalizers.yaml
