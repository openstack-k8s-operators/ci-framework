# All variables intended for modification should be placed in this file.
# All variables within this role should have a prefix of "cifmw_nfs"

cifmw_nfs_network: "storage"
cifmw_nfs_target: "computes"
cifmw_nfs_server_ip: ""
cifmw_nfs_clients_cidr: ""
cifmw_nfs_debug: false

# Per-share ownership overrides, keyed by share name. Each entry may set any
# of owner/group/mode. When owner or group is not set, the attribute is left
# untouched (the directory keeps the ownership of the creating user). When mode
# is not set, it falls back to the default below.
cifmw_nfs_share_ownership: {}
# Important: due to ci-framework configuration, the leading 0 must be kept,
# otherwise the string is interpeted as integer, breaking the chmod
# (770 integer -> 1402 octal)
cifmw_nfs_share_default_mode: "0755"
