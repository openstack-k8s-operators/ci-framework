---
- name: Check if new ssh keypair exists
  when: vm_type == 'crc'
  ansible.builtin.include_role:
    name: recognize_ssh_keypair

- name: "Push ssh jumper/configuration for {{ vm }}"
  vars:
    _ocp_name: >-
      {{
        vm |
        replace('ocp-', '')
      }}
    _hostname: >-
      {{
        (vm is match('^ocp.*')) |
        ternary(_ocp_name, vm)
      }}
    _type_id: >-
      {{
        vm |
        regex_replace('^.*-([0-9]+)$',
                      vm_type ~ '-\1')
      }}
    _user: "{{ 'core' if vm is match('^(crc|ocp).*') else vm_data.get('user', 'zuul') }}"
    dataset:
      ssh_dir: "{{ ansible_user_dir }}/.ssh"
      user: "{{ _user }}"
      hostname: "{{ _hostname }}.utility"
      patterns:
        - "{{ vm }}"
        - "{{ _type_id }}"
        - "{{ _type_id }}.utility"
        - "{{ _hostname }}.localdomain"
        - "{{ _type_id }}.{{ inventory_hostname }}"
        - "{{ _hostname }}"
        - "{{ vm_con_name }}"
        - "{{ _hostname }}.{{ inventory_hostname }}"
    proxy_data:
      target: localhost
      proxy_host: "{{ ansible_host | default(inventory_hostname) }}"
      proxy_user: "{{ ansible_user | default(lookup('env', 'USER')) }}"
      ssh_dir: "{{ ansible_user_dir }}/.ssh"
    ssh_ident:
      identity_file: >-
        {{
          cifmw_libvirt_manager_basedir ~ '/artifacts/cifmw_ocp_access_key' if vm_type is match('^ocp.*') else
          ansible_user_dir ~ '/.crc/machines/crc/' +  crc_ssh_keypair if vm_type == 'crc' else
          ansible_user_dir ~ '/.ssh/cifmw_reproducer_key'
        }}
    config: >-
      {% set output = [] -%}
      {% if inventory_hostname not in ['localhost', 'instance'] -%}
      {% set _ = output.append(dataset | combine(proxy_data) ) -%}
      {% endif -%}
      {% set _ = output.append(dataset | combine(ssh_ident)) -%}
      {{ output }}
    cifmw_ssh_jumper_config: "{{ config }}"
  ansible.builtin.include_role:
    name: "ssh_jumper"

# TODO: consider ignition/butane instead
- name: "Configure ssh access on VM {{ vm }}"
  when:
    - vm is match('^(ocp|crc).*')
    - _cifmw_libvirt_manager_layout.vms[vm_type].start | default(true)
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      cat ~/.ssh/authorized_keys |
      ssh -v core@{{ vm_con_name }} "cat >> ~/.ssh/authorized_keys"
  retries: 5
  delay: 60
  register: _ssh_access
  until: _ssh_access.rc == 0

# TODO: consider https://docs.fedoraproject.org/en-US/fedora-coreos/storage/#_sizing_the_root_partition
- name: Ensure we grow volume for OCP cluster members
  when:
    - vm is match('^ocp.*')
    - _cifmw_libvirt_manager_layout.vms[vm_type].start | default(true)
  vars:
    _root_part: "{{ vm_data.root_part_id | default('1') }}"
  ansible.builtin.shell:
    cmd: >-
      ssh core@{{ vm_con_name }}
      "sudo growpart /dev/sda {{ _root_part }}; sudo unshare --mount -- bash -c 'mount -o remount,rw /sysroot && xfs_growfs /sysroot'"

- name: "Wait for SSH access on {{ vm }}"
  when:
    - vm_type is match('^controller.*$')
    - _cifmw_libvirt_manager_layout.vms[vm_type].start | default(true)
  ansible.builtin.command:
    cmd: >-
      ssh -v -o BatchMode=yes -o ConnectTimeout=10
      -o IdentitiesOnly=yes
      -i {{ ansible_user_dir }}/.ssh/cifmw_reproducer_key
      {{ _init_admin_user }}@{{ vm_con_name }} true
  retries: 20
  delay: 15
  register: _ssh_wait
  until: _ssh_wait.rc == 0
  changed_when: false

- name: "Manage ssh keys on {{ vm }}"
  when:
    - vm_type is match('^controller.*$')
    - _cifmw_libvirt_manager_layout.vms[vm_type].start | default(true)
  vars:
    _user: "{{ vm_data.get('user', 'zuul') }}"
  block:
    - name: "Stage private key for {{ vm }}"
      ansible.builtin.copy:
        dest: "{{ ansible_user_dir }}/.ssh/.inject_id_cifw_{{ vm }}"
        content: "{{ priv_key }}"
        mode: "0400"

    - name: "Stage public key for {{ vm }}"
      ansible.builtin.copy:
        dest: "{{ ansible_user_dir }}/.ssh/.inject_id_cifw_{{ vm }}.pub"
        content: "{{ pub_key }}"
        mode: "0444"

    - name: "Inject private key on hosts {{ vm }}"
      ansible.builtin.command:
        cmd: >-
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          -o IdentitiesOnly=yes
          -i {{ ansible_user_dir }}/.ssh/cifmw_reproducer_key
          {{ ansible_user_dir }}/.ssh/.inject_id_cifw_{{ vm }}
          {{ _init_admin_user }}@{{ vm_con_name }}:/home/{{ _user }}/.ssh/id_cifw

    - name: "Inject public key on hosts {{ vm }}"
      ansible.builtin.command:
        cmd: >-
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          -o IdentitiesOnly=yes
          -i {{ ansible_user_dir }}/.ssh/cifmw_reproducer_key
          {{ ansible_user_dir }}/.ssh/.inject_id_cifw_{{ vm }}.pub
          {{ _init_admin_user }}@{{ vm_con_name }}:/home/{{ _user }}/.ssh/id_cifw.pub

    - name: "Set key ownership on {{ vm }}"
      ansible.builtin.command:
        cmd: >-
          ssh -o IdentitiesOnly=yes
          -i {{ ansible_user_dir }}/.ssh/cifmw_reproducer_key
          {{ _init_admin_user }}@{{ vm_con_name }}
          "chown {{ _user }}:{{ _user }}
          /home/{{ _user }}/.ssh/id_cifw
          /home/{{ _user }}/.ssh/id_cifw.pub &&
          chmod 0400 /home/{{ _user }}/.ssh/id_cifw &&
          chmod 0444 /home/{{ _user }}/.ssh/id_cifw.pub"

    - name: "Remove staged keys for {{ vm }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ ansible_user_dir }}/.ssh/.inject_id_cifw_{{ vm }}"
        - "{{ ansible_user_dir }}/.ssh/.inject_id_cifw_{{ vm }}.pub"
