- name: Validate discover_osp_pod inputs
  ansible.builtin.assert:
    that:
      - cifmw_discover_osp_pod_component | length > 0
      - cifmw_discover_osp_pod_namespace | length > 0
      - cifmw_discover_osp_pod_index | int >= 0
      - cifmw_discover_osp_pod_labels is mapping
    fail_msg: >-
      discover_osp_pod requires cifmw_discover_osp_pod_component (lib-common
      "component" label value, e.g. cinder-api) and a non-empty namespace.

- name: Start label selectors with required component label
  ansible.builtin.set_fact:
    _cifmw_discover_osp_pod_label_selectors:
      - "component={{ cifmw_discover_osp_pod_component }}"

- name: Add optional service label (lib-common AppSelector)
  when: cifmw_discover_osp_pod_service | length > 0
  ansible.builtin.set_fact:
    _cifmw_discover_osp_pod_label_selectors: >-
      {{
        _cifmw_discover_osp_pod_label_selectors
        + ['service=' ~ cifmw_discover_osp_pod_service]
      }}

- name: Add optional extra equality labels
  when: cifmw_discover_osp_pod_labels | length > 0
  ansible.builtin.set_fact:
    _cifmw_discover_osp_pod_label_selectors: >-
      {{
        _cifmw_discover_osp_pod_label_selectors
        + ([item.key ~ '=' ~ item.value])
      }}
  loop: "{{ cifmw_discover_osp_pod_labels | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"

- name: Query pods by namespace and labels
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ cifmw_discover_osp_pod_namespace }}"
    label_selectors: "{{ _cifmw_discover_osp_pod_label_selectors }}"
    wait: "{{ cifmw_discover_osp_pod_wait | bool }}"
    wait_timeout: "{{ cifmw_discover_osp_pod_wait_timeout | int }}"
    wait_condition:
      type: Ready
      status: "True"
  register: _cifmw_discover_osp_pod_query

- name: Fail when no pods match the label selectors
  when: (_cifmw_discover_osp_pod_query.resources | default([])) | length == 0
  ansible.builtin.fail:
    msg: >-
      No pods found in namespace {{ cifmw_discover_osp_pod_namespace }}
      with label selectors {{ _cifmw_discover_osp_pod_label_selectors }}.
      Use lib-common labels (component=/service=) instead of hardcoded names
      such as cinder-api-0; uniquePodNames may hash the pod name.

- name: Sort matching pod names for stable ordinal selection
  ansible.builtin.set_fact:
    cifmw_discover_osp_pod_resources: "{{ _cifmw_discover_osp_pod_query.resources }}"
    cifmw_discover_osp_pod_names: >-
      {{
        _cifmw_discover_osp_pod_query.resources
        | map(attribute='metadata.name')
        | list
        | sort
      }}

- name: Fail when requested index is out of range
  when: >-
    (cifmw_discover_osp_pod_index | int)
    >= (cifmw_discover_osp_pod_names | length)
  ansible.builtin.fail:
    msg: >-
      Requested pod index {{ cifmw_discover_osp_pod_index }} but only
      {{ cifmw_discover_osp_pod_names | length }} pod(s) matched
      {{ _cifmw_discover_osp_pod_label_selectors }} in
      {{ cifmw_discover_osp_pod_namespace }}: {{ cifmw_discover_osp_pod_names }}.

- name: Export selected pod name
  ansible.builtin.set_fact:
    cifmw_discover_osp_pod_name: >-
      {{ cifmw_discover_osp_pod_names[cifmw_discover_osp_pod_index | int] }}
