- name: Skip discover when no pods for this component
  when: (_cifmw_discover_osp_pod_probe.resources | default([]) | length) == 0
  ansible.builtin.debug:
    msg: >-
      Skipping discover_osp_pod for component={{ _cifmw_discover_osp_pod_probe.item.component }}
      in {{ cifmw_discover_osp_pod_namespace }} (no matching pods).

- name: Discover pod via lib-common labels
  when: (_cifmw_discover_osp_pod_probe.resources | default([]) | length) > 0
  ansible.builtin.include_tasks: main.yml
  vars:
    cifmw_discover_osp_pod_component: "{{ _cifmw_discover_osp_pod_probe.item.component }}"
    cifmw_discover_osp_pod_service: "{{ _cifmw_discover_osp_pod_probe.item.service | default('') }}"
    cifmw_discover_osp_pod_labels: "{{ _cifmw_discover_osp_pod_probe.item.labels | default({}) }}"
    cifmw_discover_osp_pod_index: "{{ _cifmw_discover_osp_pod_probe.item.index | default(0) }}"
    cifmw_discover_osp_pod_wait: false

- name: Record and show discovered pod name
  when: (_cifmw_discover_osp_pod_probe.resources | default([]) | length) > 0
  block:
    - name: Assert discovery returned a pod name
      ansible.builtin.assert:
        that:
          - cifmw_discover_osp_pod_name is defined
          - cifmw_discover_osp_pod_name | length > 0
        fail_msg: >-
          discover_osp_pod returned an empty name for
          component={{ _cifmw_discover_osp_pod_probe.item.component }}

    - name: Show uniquePodNames-safe discovery result
      ansible.builtin.debug:
        msg: >-
          Discovered {{ _cifmw_discover_osp_pod_probe.item.component }} pod
          via labels: {{ cifmw_discover_osp_pod_name }}
          (all matches: {{ cifmw_discover_osp_pod_names }})

    - name: Accumulate discovery results
      ansible.builtin.set_fact:
        cifmw_discover_osp_pod_verify_results: >-
          {{
            (cifmw_discover_osp_pod_verify_results | default({}))
            | combine({
                _cifmw_discover_osp_pod_probe.item.component: {
                  'name': cifmw_discover_osp_pod_name,
                  'names': cifmw_discover_osp_pod_names
                }
              })
          }}
