# Prove label-based discovery works against the live control plane (including
# uniquePodNames hashed pod names). Skips targets with no matching pods so
# scenarios without Cinder/Glance stay green.

- name: Initialize discovery verification results
  ansible.builtin.set_fact:
    cifmw_discover_osp_pod_verify_results: {}

- name: Probe whether target pods exist before discovering
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ cifmw_discover_osp_pod_namespace }}"
    label_selectors: >-
      {{
        ['component=' ~ item.component]
        + (
          ['service=' ~ item.service]
          if (item.service | default('') | length) > 0
          else []
        )
      }}
    wait: false
  loop: "{{ cifmw_discover_osp_pod_verify_targets }}"
  loop_control:
    label: "{{ item.component }}"
  register: _cifmw_discover_osp_pod_probes

- name: Discover each component that has matching pods
  ansible.builtin.include_tasks: verify_one.yml
  loop: "{{ _cifmw_discover_osp_pod_probes.results }}"
  loop_control:
    label: "{{ item.item.component | default('unknown') }}"
    loop_var: _cifmw_discover_osp_pod_probe
