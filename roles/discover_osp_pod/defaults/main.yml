# Discover OpenStack service pods by Kubernetes labels (lib-common), not by
# hardcoded names. Works with uniquePodNames true or false because labels stay
# stable while pod names may include a short ControlPlane UID hash.
#
# Label keys (openstack-k8s-operators/lib-common):
#   component  -> common.ComponentSelector  (e.g. cinder-api, glance-api)
#   service    -> common.AppSelector        (e.g. cinder, glance)

cifmw_discover_osp_pod_namespace: "{{ cifmw_openstack_namespace | default('openstack') }}"

# Required: value for the "component" label (e.g. cinder-api, cinder-backup,
# glance-api).
cifmw_discover_osp_pod_component: ""

# Optional: value for the "service" label (e.g. cinder, glance).
cifmw_discover_osp_pod_service: ""

# Optional extra equality labels (dict). Useful for Glance API instances, e.g.
#   api-name: default
# or
#   glanceAPI: glance-default-external
cifmw_discover_osp_pod_labels: {}

# Which matching pod to return after sorting by name (StatefulSet ordinal).
cifmw_discover_osp_pod_index: 0

# Wait for at least one Ready pod matching the selectors.
cifmw_discover_osp_pod_wait: true
cifmw_discover_osp_pod_wait_timeout: 300

# Post-deploy verification (playbooks/06-deploy-architecture.yml).
# Probes each target; skips components that are not deployed.
cifmw_discover_osp_pod_verify: true
cifmw_discover_osp_pod_verify_targets:
  - component: cinder-api
    service: cinder
  - component: glance-api
    service: glance
