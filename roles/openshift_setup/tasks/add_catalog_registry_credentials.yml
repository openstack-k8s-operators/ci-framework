# This task file adds catalog registry credentials to the cluster pull-secret
# to enable CatalogSource pods to authenticate and pull catalog images.

- name: Add catalog registry credentials to cluster pull-secret
  when:
    - cifmw_openshift_setup_catalog_registry_credentials is defined
    - cifmw_openshift_setup_catalog_registry_credentials | length > 0
  block:
    - name: Get current cluster pull-secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
        api_key: "{{ cifmw_openshift_token | default(omit) }}"
        context: "{{ cifmw_openshift_context | default(omit) }}"
        kind: Secret
        name: pull-secret
        namespace: openshift-config
      register: _cluster_pull_secret
      no_log: true

    - name: Initialize merged auths with current cluster auths
      ansible.builtin.set_fact:
        _merged_auths: "{{ (_cluster_pull_secret.resources[0].data['.dockerconfigjson'] | b64decode | from_json).auths }}"
      no_log: true

    - name: Add each catalog credential to merged auths
      vars:
        _auth_string: "{{ item.username }}:{{ item.password }}"
        _new_auth:
          "{{ item.registry }}":
            auth: "{{ _auth_string | b64encode }}"
      ansible.builtin.set_fact:
        _merged_auths: "{{ _merged_auths | combine(_new_auth, recursive=true) }}"
      loop: "{{ cifmw_openshift_setup_catalog_registry_credentials }}"
      no_log: true

    - name: Update cluster pull-secret with catalog credentials
      vars:
        _merged_pull_secret:
          auths: "{{ _merged_auths }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
        api_key: "{{ cifmw_openshift_token | default(omit) }}"
        context: "{{ cifmw_openshift_context | default(omit) }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: pull-secret
            namespace: openshift-config
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ _merged_pull_secret | to_json | b64encode }}"
      no_log: true
