- name: Wait for OpenShift API to be available
  environment:
    PATH: "{{ ansible_env.PATH }}:{{ ansible_user_dir }}/bin"
    KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
  ansible.builtin.command:
    cmd: "oc cluster-info"
  register: _ocp_api_check
  until: _ocp_api_check.rc == 0
  retries: 60
  delay: 10
  changed_when: false
  failed_when: false

- name: Fail if OpenShift API is not available
  when: _ocp_api_check.rc != 0
  ansible.builtin.fail:
    msg: "OpenShift API is not available after waiting 10 minutes. Cluster may not be fully started."
