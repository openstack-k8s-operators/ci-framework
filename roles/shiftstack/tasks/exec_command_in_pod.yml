- name: Command execution block
  block:
    - name: Kill any previous background command and clear markers
      kubernetes.core.k8s_exec:
        kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
        namespace: "{{ namespace }}"
        pod: "{{ pod_name }}"
        command: >-
          bash -c 'if [ -f /tmp/cifmw_cmd_pid ]; then
          kill $(cat /tmp/cifmw_cmd_pid) 2>/dev/null;
          wait $(cat /tmp/cifmw_cmd_pid) 2>/dev/null; fi;
          rm -f /tmp/cifmw_cmd_rc /tmp/cifmw_cmd_pid
          /tmp/cifmw_cmd_script.sh /tmp/cifmw_cmd_output.log'
      changed_when: false
      failed_when: false

    - name: Copy the command script into the pod
      kubernetes.core.k8s_cp:
        kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
        namespace: "{{ namespace }}"
        pod: "{{ pod_name }}"
        remote_path: /tmp/cifmw_cmd_script.sh
        content: |
          #!/bin/bash
          {{ command }}
        state: to_pod

    - name: Execute detached in the pod - {{ command }}
      kubernetes.core.k8s_exec:
        kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
        namespace: "{{ namespace }}"
        pod: "{{ pod_name }}"
        command: >-
          bash -c 'rm -f /tmp/cifmw_cmd_rc /tmp/cifmw_cmd_pid;
          nohup bash -c "bash /tmp/cifmw_cmd_script.sh;
          echo \$? > /tmp/cifmw_cmd_rc"
          > /tmp/cifmw_cmd_output.log 2>&1 &
          echo $! > /tmp/cifmw_cmd_pid && cat /tmp/cifmw_cmd_pid'
      register: pod_command_result

    # Poll in a shell loop so soft-transient errors (connection refused / i/o
    # timeout) can use a consecutive failure budget without burning the full
    # 8h window when the API is truly unreachable. Hard-transient patterns
    # still retry for the full cifmw_shiftstack_exec_retries window.
    # Exit codes from this poller:
    #   0  - background command finished (stdout holds /tmp/cifmw_cmd_rc)
    #   2  - background process gone without writing a marker
    #   3  - soft-transient budget exhausted
    #  10  - still running after cifmw_shiftstack_exec_retries attempts
    # other - non-retryable oc exec failure
    - name: Wait for the command to complete in the pod
      environment:
        PATH: "{{ cifmw_path }}"
        KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
      vars:
        _hard_transient_re: "{{ cifmw_shiftstack_exec_transient_patterns | join('|') }}"
        _soft_transient_re: "{{ cifmw_shiftstack_exec_soft_transient_patterns | join('|') }}"
      ansible.builtin.shell: |
        set -euo pipefail
        soft=0
        attempts=0
        max_retries={{ cifmw_shiftstack_exec_retries | int }}
        delay={{ cifmw_shiftstack_exec_delay | int }}
        soft_max={{ cifmw_shiftstack_exec_soft_transient_max | int }}
        hard_re={{ _hard_transient_re | quote }}
        soft_re={{ _soft_transient_re | quote }}
        ns={{ namespace | quote }}
        pod={{ pod_name | quote }}
        poll_cmd='if cat /tmp/cifmw_cmd_rc 2>/dev/null; then exit 0; elif [ -f /tmp/cifmw_cmd_pid ] && kill -0 $(cat /tmp/cifmw_cmd_pid) 2>/dev/null; then exit 10; else exit 2; fi'

        emit_attempts() {
          echo "CIFMW_SHIFTSTACK_POLL_ATTEMPTS=${attempts}" >&2
        }

        while [ "${attempts}" -lt "${max_retries}" ]; do
          attempts=$((attempts + 1))
          stderr_file="$(mktemp)"
          set +e
          stdout="$(oc exec -n "${ns}" "${pod}" -- bash -c "${poll_cmd}" 2>"${stderr_file}")"
          rc=$?
          set -e
          stderr="$(cat "${stderr_file}" 2>/dev/null || true)"
          rm -f "${stderr_file}"

          if [ "${rc}" -eq 0 ] || [ "${rc}" -eq 2 ]; then
            printf '%s\n' "${stdout}"
            printf '%s\n' "${stderr}" >&2
            emit_attempts
            exit "${rc}"
          fi

          if [ "${rc}" -eq 10 ]; then
            soft=0
            sleep "${delay}"
            continue
          fi

          # oc exec itself failed (typically rc=1). Classify stderr.
          if [ -n "${hard_re}" ] && printf '%s\n' "${stderr}" | grep -Eiq -- "${hard_re}"; then
            soft=0
            sleep "${delay}"
            continue
          fi

          if [ -n "${soft_re}" ] && printf '%s\n' "${stderr}" | grep -Eiq -- "${soft_re}"; then
            soft=$((soft + 1))
            if [ "${soft}" -ge "${soft_max}" ]; then
              printf '%s\n' "${stderr}" >&2
              emit_attempts
              exit 3
            fi
            sleep "${delay}"
            continue
          fi

          printf '%s\n' "${stderr}" >&2
          emit_attempts
          exit "${rc}"
        done

        emit_attempts
        exit 10
      args:
        executable: /bin/bash
      register: pod_exit_code
      changed_when: false
      failed_when: false

    - name: Normalize poll result metadata
      vars:
        _attempt_line: >-
          {{
            pod_exit_code.stderr_lines | default([])
            | select('match', '^CIFMW_SHIFTSTACK_POLL_ATTEMPTS=')
            | list | first | default('CIFMW_SHIFTSTACK_POLL_ATTEMPTS=1')
          }}
        _stderr_without_attempts: >-
          {{
            pod_exit_code.stderr_lines | default([])
            | reject('match', '^CIFMW_SHIFTSTACK_POLL_ATTEMPTS=')
            | list | join('\n')
          }}
      ansible.builtin.set_fact:
        pod_exit_code: >-
          {{
            pod_exit_code | combine({
              'attempts': (_attempt_line | regex_replace('^CIFMW_SHIFTSTACK_POLL_ATTEMPTS=', '') | int),
              'stderr': _stderr_without_attempts,
              'stderr_lines': (
                _stderr_without_attempts | split('\n')
                if (_stderr_without_attempts | length) > 0 else []
              )
            })
          }}

    - name: Fail if soft-transient API errors exhausted
      ansible.builtin.fail:
        msg: >-
          Lost connection to pod {{ pod_name }} after
          {{ cifmw_shiftstack_exec_soft_transient_max }} consecutive soft-transient
          oc exec errors (for example connection refused or i/o timeout).
          Failed after {{ pod_exit_code.attempts | default(1) }} polling attempt(s).
          oc exec stderr: {{ pod_exit_code.stderr | default('(none)') | trim }}
      when: pod_exit_code.rc == 3

    - name: Fail if the pod is no longer reachable
      ansible.builtin.fail:
        msg: >-
          Lost connection to pod {{ pod_name }}. The pod may have been
          evicted, OOM-killed, or the API server became unreachable.
          Failed after {{ pod_exit_code.attempts | default(1) }} polling attempt(s).
          oc exec stderr: {{ pod_exit_code.stderr | default('(none)') | trim }}
      when:
        - pod_exit_code.rc != 0
        - pod_exit_code.rc != 2
        - pod_exit_code.rc != 3
        - pod_exit_code.rc != 10

    - name: Fail if the background process died without writing the marker
      ansible.builtin.fail:
        msg: >-
          The background process in pod {{ pod_name }} exited without writing a result.
          The command may have been killed by OOM or a signal.
          oc exec stderr: {{ pod_exit_code.stderr | default('(none)') | trim }}
      when: pod_exit_code.rc == 2

    - name: Fail if polling timed out
      ansible.builtin.fail:
        msg: >-
          Timed out waiting for "{{ command }}" to complete
          in pod {{ pod_name }} after {{ cifmw_shiftstack_exec_retries }} attempts.
      when: pod_exit_code.rc == 10

    - name: Fail if the command failed inside the pod
      ansible.builtin.fail:
        msg: >-
          "{{ command }}" failed inside the pod with
          exit code {{ pod_exit_code.stdout | trim }}.
      when:
        - pod_exit_code.rc == 0
        - (pod_exit_code.stdout | default('') | trim) != '0'

  rescue:
    - name: Kill background process on failure
      kubernetes.core.k8s_exec:
        kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
        namespace: "{{ namespace }}"
        pod: "{{ pod_name }}"
        command: >-
          bash -c 'if [ -f /tmp/cifmw_cmd_pid ]; then
          kill $(cat /tmp/cifmw_cmd_pid) 2>/dev/null; fi'
      failed_when: false
      changed_when: false

    - name: Retrieve command output from pod
      kubernetes.core.k8s_exec:
        kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
        namespace: "{{ namespace }}"
        pod: "{{ pod_name }}"
        command: >-
          bash -c 'tail -c 8192 /tmp/cifmw_cmd_output.log 2>/dev/null
          || echo "(output not available)"'
      register: pod_output_log
      failed_when: false
      changed_when: false

    - name: Fail with diagnostic information
      ansible.builtin.fail:
        msg: >-
          "{{ command }}" failed.
          pod exit code: {{ pod_exit_code.stdout | default('N/A') | trim }},
          output (last 8KB): {{ pod_output_log.stdout | default('(not retrieved)') }}

  always:
    - name: Command execution log saving block
      when: log_file_name | default(false)
      block:
        - name: Retrieve command output for log
          kubernetes.core.k8s_exec:
            kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
            namespace: "{{ namespace }}"
            pod: "{{ pod_name }}"
            command: >-
              bash -c 'tail -c 16384 /tmp/cifmw_cmd_output.log 2>/dev/null
              || echo "(output not available)"'
          register: pod_output_for_log
          failed_when: false
          changed_when: false

        - name: Get current date and time
          ansible.builtin.command:
            cmd: date +"%Y_%m_%d-%H_%M_%S"
          register: current_date

        - name: Save the command execution information in the log file in '{{ cifmw_shiftstack_ansible_command_logs_dir }}'
          vars:
            command_info:
              namespace: "{{ namespace }}"
              pod_name: "{{ pod_name }}"
              command: "{{ command }}"
              pod_command_result: "{{ pod_command_result | default('N/A') }}"
              pod_exit_code: "{{ pod_exit_code | default('N/A') }}"
              pod_output: "{{ pod_output_for_log.stdout | default('N/A') }}"
          ansible.builtin.copy:
            content: "{{ command_info | to_nice_yaml }}"
            dest: "{{ cifmw_shiftstack_ansible_command_logs_dir }}/{{ current_date.stdout }}.{{ log_file_name }}"
            mode: "0644"
