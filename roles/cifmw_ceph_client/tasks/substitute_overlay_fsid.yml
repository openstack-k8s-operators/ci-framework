# Substitutes the real Ceph FSID into every "rbd_secret_uuid = <placeholder>"
# occurrence of a service-values overlay, in place. This is required when the
# Cinder backend configuration (for example the per-availability-zone backends
# of the ShiftStack AZ scenario) is supplied as a kustomize overlay that is
# merged into the deployment AFTER this role runs: the overlay would otherwise
# re-introduce the placeholder into the rendered service-values. Writing the
# FSID into the overlay source here, while the cluster FSID is known, ensures
# the later merge carries the real value.

- name: Stat FSID substitution overlay {{ cifmw_ceph_client_overlay_path }}
  ansible.builtin.stat:
    path: "{{ cifmw_ceph_client_overlay_path }}"
  register: cifmw_ceph_client_overlay_stat

- name: Substitute Ceph FSID placeholder in {{ cifmw_ceph_client_overlay_path }}
  when: cifmw_ceph_client_overlay_stat.stat.exists | bool
  vars:
    cifmw_ceph_client_overlay_content: "{{ lookup('ansible.builtin.file', cifmw_ceph_client_overlay_path) }}"
  ansible.builtin.copy:
    mode: preserve
    dest: "{{ cifmw_ceph_client_overlay_path }}"
    content: "{{ cifmw_ceph_client_overlay_content
      | regex_replace('(rbd_secret_uuid *= *)' ~ cifmw_ceph_client_fsid_placeholder,
                      '\\g<1>' ~ cifmw_ceph_client_fsid) }}"
