- name: Check the required inputs are defined
  ansible.builtin.assert:
    that:
      - cifmw_multi_node_routing_remotes is defined
      - cifmw_multi_node_routing_overlay_ranges is defined
      - cifmw_multi_node_routing_iface is defined
      - cifmw_multi_node_routing_bridge is defined
      - cifmw_multi_node_routing_route_table is defined
      - cifmw_multi_node_routing_rule_priority is defined
    fail_msg: >-
      multi_node_routing requires the caller to define
      cifmw_multi_node_routing_remotes, cifmw_multi_node_routing_overlay_ranges,
      cifmw_multi_node_routing_iface, cifmw_multi_node_routing_bridge,
      cifmw_multi_node_routing_route_table and
      cifmw_multi_node_routing_rule_priority.
    quiet: true

# Installed and applied before the tunnels come up, so the tunnel packets
# never follow an overlay route.
- name: Install the routing dispatcher script
  become: true
  ansible.builtin.template:
    src: nm-dispatcher.sh.j2
    dest: /etc/NetworkManager/dispatcher.d/90-cifmw-vxlan-overlay
    owner: root
    group: root
    mode: "0755"

- name: Apply the routing rules
  become: true
  ansible.builtin.command:
    cmd: /bin/bash /etc/NetworkManager/dispatcher.d/90-cifmw-vxlan-overlay
  changed_when: true

- name: Check the underlay routing rules are in place
  become: true
  ansible.builtin.command:
    cmd: ip -4 rule show priority {{ cifmw_multi_node_routing_rule_priority }}
  register: _cifmw_multi_node_routing_rules_initial
  changed_when: false
  failed_when: >-
    cifmw_multi_node_routing_remotes
    | reject('in', _cifmw_multi_node_routing_rules_initial.stdout)
    | list | length > 0
