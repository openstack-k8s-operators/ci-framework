# Run again once the profiles are up and NetworkManager has run the
# dispatcher for them, so a missing rule fails here rather than in a later
# test.
- name: Check the routing rules are in place
  become: true
  ansible.builtin.shell: |
    ip -4 rule show priority {{ cifmw_multi_node_routing_rule_priority }}
    ip -4 route show table {{ cifmw_multi_node_routing_route_table }}
  register: _cifmw_multi_node_routing_rules_final
  changed_when: false
  failed_when: >-
    ('default via' not in _cifmw_multi_node_routing_rules_final.stdout)
    or (cifmw_multi_node_routing_remotes
        | reject('in', _cifmw_multi_node_routing_rules_final.stdout)
        | list | length > 0)
