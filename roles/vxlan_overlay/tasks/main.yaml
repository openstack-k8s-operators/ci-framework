# Run in a play whose hosts are exactly cifmw_vxlan_overlay_hosts.
- name: Validate the input
  ansible.builtin.import_tasks: validate.yaml

- name: Discover the underlay
  ansible.builtin.import_tasks: underlay.yaml

- name: Plan the overlay
  ansible.builtin.import_tasks: plan.yaml

- name: Write the NetworkManager configuration
  ansible.builtin.import_tasks: networkmanager.yaml

- name: Install the underlay policy routing
  when: cifmw_vxlan_overlay_policy_routing | bool
  ansible.builtin.import_tasks: routing.yaml

- name: Start the overlay
  ansible.builtin.import_tasks: overlay.yaml

- name: Prepare EDPM hosts
  ansible.builtin.import_tasks: edpm.yaml

- name: Configure the hub gateway
  when:
    - inventory_hostname == cifmw_vxlan_overlay_hub
    - cifmw_vxlan_overlay_gateway | bool
  ansible.builtin.import_tasks: gateway.yaml

- name: Write the networking information file
  ansible.builtin.import_tasks: networking_info.yaml
