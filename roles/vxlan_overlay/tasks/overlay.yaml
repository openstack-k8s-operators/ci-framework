- name: Start the overlay
  become: true
  block:
    - name: Create the overlay configuration directory
      ansible.builtin.file:
        path: "{{ cifmw_vxlan_overlay_script | dirname }}"
        state: directory
        mode: "0755"

    - name: Install the overlay script
      ansible.builtin.template:
        src: cifmw-vxlan-overlay.sh.j2
        dest: "{{ cifmw_vxlan_overlay_script }}"
        mode: "0755"
      register: _cifmw_vxlan_overlay_script_out

    - name: Install the overlay unit
      ansible.builtin.template:
        src: cifmw-vxlan-overlay.service.j2
        dest: "/etc/systemd/system/{{ cifmw_vxlan_overlay_unit }}.service"
        mode: "0644"
      register: _cifmw_vxlan_overlay_unit_out

    - name: Allow the overlay port in firewalld
      ansible.builtin.shell: |
        set -e
        if systemctl is-active --quiet firewalld; then
          zone=$(firewall-cmd --get-zone-of-interface={{ _cifmw_vxlan_overlay_underlay_dev }} 2>/dev/null || firewall-cmd --get-default-zone)
          firewall-cmd --zone="$zone" --add-port={{ cifmw_vxlan_overlay_dstport }}/udp
          firewall-cmd --permanent --zone="$zone" --add-port={{ cifmw_vxlan_overlay_dstport }}/udp
          echo "firewalld: opened {{ cifmw_vxlan_overlay_dstport }}/udp in $zone"
        else
          echo "firewalld not active"
        fi
      register: _cifmw_vxlan_overlay_fw
      changed_when: "'opened' in _cifmw_vxlan_overlay_fw.stdout"

    - name: Start the overlay unit
      ansible.builtin.systemd:
        name: "{{ cifmw_vxlan_overlay_unit }}"
        daemon_reload: true
        enabled: true
        state: >-
          {{ 'restarted' if (_cifmw_vxlan_overlay_script_out is changed or _cifmw_vxlan_overlay_unit_out is changed)
             else 'started' }}

    - name: Apply the udev rule to the overlay veth  # noqa: risky-shell-pipe
      ansible.builtin.shell: |
        set -e
        udevadm trigger --action=change --subsystem-match=net --sysname-match={{ cifmw_vxlan_overlay_iface }}
        udevadm settle --timeout=30
        udevadm info --query=property --path=/sys/class/net/{{ cifmw_vxlan_overlay_iface }} | grep '^NM_UNMANAGED=' || echo NM_UNMANAGED=unset
      register: _cifmw_vxlan_overlay_udev_state
      changed_when: false
      failed_when: "'NM_UNMANAGED=1' in _cifmw_vxlan_overlay_udev_state.stdout"

    - name: Bring the profiles up
      ansible.builtin.command:
        cmd: nmcli connection up id {{ item.value.connection }}
      loop: "{{ _cifmw_vxlan_overlay_profiles }}"
      loop_control:
        label: "{{ item.value.connection }}"
      register: _cifmw_vxlan_overlay_up
      changed_when: true
      retries: 5
      delay: 5
      until: _cifmw_vxlan_overlay_up.rc == 0
