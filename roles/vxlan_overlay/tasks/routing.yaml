# Installed and applied before the tunnels come up, so the tunnel packets
# never follow an overlay route.
- name: Install the underlay routing dispatcher script
  become: true
  ansible.builtin.template:
    src: nm-dispatcher.sh.j2
    dest: /etc/NetworkManager/dispatcher.d/90-cifmw-vxlan-overlay
    owner: root
    group: root
    mode: "0755"

- name: Apply the underlay routing rules
  become: true
  ansible.builtin.command:
    cmd: /bin/bash /etc/NetworkManager/dispatcher.d/90-cifmw-vxlan-overlay
  changed_when: true

- name: Check the underlay routing rules are in place
  become: true
  ansible.builtin.command:
    cmd: ip -4 rule show priority {{ cifmw_vxlan_overlay_rule_priority }}
  register: _cifmw_vxlan_overlay_rules
  changed_when: false
  failed_when: >-
    _cifmw_vxlan_overlay_tunnels | map(attribute='remote')
    | reject('in', _cifmw_vxlan_overlay_rules.stdout) | list | length > 0
