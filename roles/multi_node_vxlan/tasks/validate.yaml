- name: Check the required transport inputs
  ansible.builtin.assert:
    that:
      - cifmw_multi_node_vxlan_mac is defined
      - cifmw_multi_node_vxlan_mac is string
      - cifmw_multi_node_vxlan_mac | trim | length > 0
      - cifmw_multi_node_vxlan_bridge is defined
      - cifmw_multi_node_vxlan_iface is defined
      - cifmw_multi_node_vxlan_peer_iface is defined
      - cifmw_multi_node_vxlan_mtu is defined
      - cifmw_multi_node_vxlan_dstport is defined
      - cifmw_multi_node_vxlan_tunnels is defined
      - cifmw_multi_node_vxlan_tunnel_prefix is defined
      - cifmw_multi_node_vxlan_unmanaged_interfaces is defined
      - cifmw_multi_node_vxlan_marker is defined
      - cifmw_multi_node_vxlan_unit is defined
      - cifmw_multi_node_vxlan_script is defined
      - cifmw_multi_node_vxlan_start_commands is defined
      - cifmw_multi_node_vxlan_stop_commands is defined
    fail_msg: >-
      multi_node_vxlan requires explicit transport inputs, including a non-empty
      cifmw_multi_node_vxlan_mac. Map every cifmw_multi_node_vxlan_* input from the caller.
    quiet: true
