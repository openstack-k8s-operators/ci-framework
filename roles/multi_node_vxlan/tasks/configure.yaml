- name: Validate the transport inputs
  ansible.builtin.import_tasks: validate.yaml

- name: Write the NetworkManager configuration
  become: true
  block:
    - name: Keep the overlay plumbing out of NetworkManager
      ansible.builtin.template:
        src: nm-unmanaged.conf.j2
        dest: /etc/NetworkManager/conf.d/99-cifmw-vxlan-overlay.conf
        mode: "0644"
      register: cifmw_multi_node_vxlan_nm_config_result

    # NetworkManager's 85-nm-unmanaged.rules marks veth devices not named
    # eth* as unmanaged. An explicit 'nmcli connection up' overrides that,
    # but autoconnect at boot does not, so the overlay interface comes back
    # without its address after a reboot (and NNCP cannot use it).
    - name: Let NetworkManager manage the overlay veth
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/86-cifmw-vxlan-overlay.rules
        mode: "0644"
        content: |
          # Managed by Ansible (multi_node_vxlan). Overrides 85-nm-unmanaged.rules.
          SUBSYSTEM=="net", ENV{INTERFACE}=="{{ cifmw_multi_node_vxlan_iface }}", ENV{NM_UNMANAGED}="0"
      register: cifmw_multi_node_vxlan_udev_rule_result

    # Reload before creating devices without flushing unrelated handlers.
    - name: Reload the NetworkManager configuration  # noqa: no-handler
      ansible.builtin.command:
        cmd: nmcli general reload conf
      when: cifmw_multi_node_vxlan_nm_config_result.changed
      changed_when: true

    - name: Reload udev rules  # noqa: no-handler
      ansible.builtin.command:
        cmd: udevadm control --reload
      when: cifmw_multi_node_vxlan_udev_rule_result.changed
      changed_when: true
