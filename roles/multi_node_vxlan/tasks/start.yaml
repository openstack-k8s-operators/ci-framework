- name: Validate the transport inputs
  ansible.builtin.import_tasks: validate.yaml

- name: Start the overlay
  become: true
  block:
    - name: Start the overlay unit
      ansible.builtin.systemd:
        name: "{{ cifmw_multi_node_vxlan_unit }}"
        daemon_reload: true
        enabled: true
        state: >-
          {{ 'restarted' if (_cifmw_multi_node_vxlan_script_out is changed or _cifmw_multi_node_vxlan_unit_out is changed)
             else 'started' }}

    - name: Apply the udev rule to the overlay veth
      ansible.builtin.command:
        cmd: >-
          udevadm trigger --action=change --subsystem-match=net
          --sysname-match={{ cifmw_multi_node_vxlan_iface }}
      changed_when: false

    - name: Wait for udev events to finish
      ansible.builtin.command:
        cmd: udevadm settle --timeout=30
      changed_when: false

    - name: Check that the overlay veth is not marked unmanaged
      ansible.builtin.command:
        cmd: >-
          udevadm info --query=property
          --path=/sys/class/net/{{ cifmw_multi_node_vxlan_iface }}
      register: _cifmw_multi_node_vxlan_udev_state
      changed_when: false
      failed_when: >-
        _cifmw_multi_node_vxlan_udev_state.rc != 0 or
        'NM_UNMANAGED=1' in _cifmw_multi_node_vxlan_udev_state.stdout_lines
