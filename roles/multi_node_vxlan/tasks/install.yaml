- name: Validate the transport inputs
  ansible.builtin.import_tasks: validate.yaml

- name: Install the overlay
  become: true
  block:
    - name: Create the overlay configuration directory
      ansible.builtin.file:
        path: "{{ cifmw_multi_node_vxlan_script | dirname }}"
        state: directory
        mode: "0755"

    - name: Install the overlay script
      ansible.builtin.template:
        src: cifmw-vxlan-overlay.sh.j2
        dest: "{{ cifmw_multi_node_vxlan_script }}"
        mode: "0755"
      register: _cifmw_multi_node_vxlan_script_out

    - name: Install the overlay unit
      ansible.builtin.template:
        src: cifmw-vxlan-overlay.service.j2
        dest: "/etc/systemd/system/{{ cifmw_multi_node_vxlan_unit }}.service"
        mode: "0644"
      register: _cifmw_multi_node_vxlan_unit_out
