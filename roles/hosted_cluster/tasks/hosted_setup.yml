# NMState, MetalLB, cert-manager, the MetalLB/NAD resources for the isolated
# networks, storage classes and the OpenStack operator (with its init CR)
# are all applied generically by the existing deploy_architecture.yml /
# kustomize_deploy flow once retarget.yml points cifmw_openshift_kubeconfig
# at this hosted cluster. The only thing genuinely specific to a KubeVirt
# hosted control plane is enabling global IP forwarding so traffic between
# the isolated networks and the pods consuming them flows correctly -- see
# hosted_controlplanes.txt "Configuring the hosted control plane clusters
# infrastructure for RHOSO".
- name: Read hosted cluster network operator configuration
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cifmw_hosted_cluster_artifacts_dir }}/kubeconfig-{{ cifmw_hosted_cluster_name }}"
    api_version: operator.openshift.io/v1
    kind: Network
    name: cluster
  register: _hosted_cluster_network

- name: Enable global IP forwarding on the hosted cluster
  when: >-
    _hosted_cluster_network.resources | map(attribute='spec.defaultNetwork.type') |
    first | default('') == 'OVNKubernetes'
  kubernetes.core.k8s_json_patch:
    kubeconfig: "{{ cifmw_hosted_cluster_artifacts_dir }}/kubeconfig-{{ cifmw_hosted_cluster_name }}"
    api_version: operator.openshift.io/v1
    kind: Network
    name: cluster
    patch:
      - op: replace
        path: /spec/defaultNetwork/ovnKubernetesConfig/gatewayConfig/ipForwarding
        value: Global
