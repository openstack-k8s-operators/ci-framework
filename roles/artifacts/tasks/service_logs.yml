---
- name: Validate service names
  ansible.builtin.assert:
    that:
      - item is string
      - item | length > 0
      - "'/' not in item"
  loop: "{{ cifmw_artifacts_service_logs }}"
  register: cifmw_artifacts_service_names

- name: Ensure the node Zuul log directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/zuul-output/logs"
    state: directory
    mode: "0755"

- name: Save service journals in the node Zuul logs
  when: cifmw_artifacts_service_names is succeeded
  become: true
  ansible.builtin.shell:
    cmd: >-
      umask 022;
      timeout 120 journalctl --unit={{ item | quote }} --no-pager --all
      > {{ (ansible_user_dir ~ '/zuul-output/logs/' ~ item ~ '.log') | quote }}
  changed_when: true
  loop: "{{ cifmw_artifacts_service_logs }}"
