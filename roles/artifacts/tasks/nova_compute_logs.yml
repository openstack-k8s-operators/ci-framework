---
- name: Ensure the compute node Zuul log directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/zuul-output/logs"
    state: directory
    mode: "0755"

- name: Save the nova-compute journal in the compute node Zuul logs
  become: true
  ansible.builtin.shell:
    cmd: >-
      umask 022;
      timeout 120 journalctl --unit=edpm_nova_compute.service --no-pager --all
      > {{ (ansible_user_dir ~ '/zuul-output/logs/nova-compute.log') | quote }}
  changed_when: true
