---
- name: Download RHOS Release if the given rpm is a URL
  when: cifmw_repo_setup_rhos_release_rpm is url
  block:
    - name: Create download directory
      ansible.builtin.file:
        path: "{{ cifmw_repo_setup_rhos_release_path }}"
        state: directory
        mode: "0755"

    - name: Print the URL to request
      ansible.builtin.debug:
        msg: "{{ cifmw_repo_setup_rhos_release_rpm }}"

    - name: Download the RPM
      vars:
        cifmw_krb_request_url: "{{ cifmw_repo_setup_rhos_release_rpm }}"
        cifmw_krb_request_dest: "{{ cifmw_repo_setup_rhos_release_path }}/rhos-release.rpm"
        cifmw_krb_request_dest_mode: "0644"
      ansible.builtin.include_role:
        name: krb_request

- name: Install RHOS Release tool
  become: true
  ansible.builtin.package:
    name: >-
      {{
        cifmw_repo_setup_rhos_release_rpm
        if cifmw_repo_setup_rhos_release_rpm is not url
        else cifmw_krb_request_out.path
      }}
    state: present
    disable_gpg_check: "{{ cifmw_repo_setup_rhos_release_gpg_check | bool }}"

- name: Get rhos-release tool version
  become: true
  ansible.builtin.command: rhos-release --version
  register: rr_version

- name: Print rhos-release tool version
  ansible.builtin.debug:
    msg: "{{ rr_version.stdout }}"

- name: "Generate repos using rhos-release {{ cifmw_repo_setup_rhos_release_args }}"
  become: true
  ansible.builtin.command:
    cmd: >-
      rhos-release {{ cifmw_repo_setup_rhos_release_args }} \
        -t {{ cifmw_repo_setup_output }}

- name: Make generated repos RHEL 10 safe
  when:
    - ansible_distribution_major_version | int >= 10
  become: "{{ not cifmw_repo_setup_output.startswith(ansible_user_dir) }}"
  vars:
    _rhel_major: "{{ ansible_distribution_major_version }}"
    _rhel_ver: "{{ ansible_distribution_version }}"
    _base_url: >-
      http://download.devel.redhat.com/released/rhel-{{ _rhel_major }}/RHEL-{{ _rhel_major }}/{{ _rhel_ver }}
  block:
    - name: Disable all rhos-release generated repos
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          for f in {{ cifmw_repo_setup_output }}/rhos-release*.repo
          {{ cifmw_repo_setup_output }}/osp-trunk*.repo; do
            [ -f "$f" ] || continue;
            sed -i 's/^enabled=1/enabled=0/' "$f";
          done
      changed_when: true

    - name: Add RHEL 10 base repos to generated directory
      ansible.builtin.copy:
        dest: "{{ cifmw_repo_setup_output }}/rhel-{{ _rhel_major }}-{{ item.name }}.repo"
        content: |
          [rhel-{{ _rhel_major }}-{{ item.name }}]
          name=RHEL {{ _rhel_major }} {{ item.path }}
          baseurl={{ _base_url }}/{{ item.path }}/x86_64/os
          gpgcheck=0
          enabled=1
        mode: "0644"
      loop:
        - name: baseos
          path: BaseOS
        - name: appstream
          path: AppStream
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure python3 build deps are available on RHEL 10+
      become: true
      ansible.builtin.dnf:
        name:
          - python3-setuptools
          - gcc
          - python3-devel
        state: present
