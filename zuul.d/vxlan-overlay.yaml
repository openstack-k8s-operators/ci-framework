- job:
    name: podified-multinode-edpm-deployment-crc-vxlan
    parent: cifmw-podified-multinode-edpm-base-crc-wo-networks
    description: Deploy EDPM on multinode CRC with VXLAN instead of Neutron trunk ports.
    nodeset: centos-9-medium-centos-9-crc-cloud-ocp-4-22-1-3xl
    files:
      - '^roles/(vxlan_overlay|multi_node_vxlan|multi_node_routing|edpm_overlay)/'
      - '^ci/playbooks/vxlan-overlay\.yml$'
      - '^zuul\.d/vxlan-overlay\.yaml$'
    # Include all changes to the overlay roles, even ones the base ignores.
    irrelevant-files: []
    pre-run:
      - ci/playbooks/vxlan-overlay.yml
    vars:
      cifmw_extras:
        - '@scenarios/centos-9/multinode-ci.yml'
        - '@scenarios/centos-9/horizon.yml'
