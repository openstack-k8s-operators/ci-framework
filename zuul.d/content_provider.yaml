---
- job:
    name: content-provider-base
    parent: openstack-k8s-operators-content-provider

- job:
    name: openstack-k8s-operators-content-provider-bootc
    parent: openstack-k8s-operators-content-provider
    timeout: 7200
    attempts: 2
    description: |
      A zuul job to build and publish bootc, bootc qcow2, and
      ironic-python-agent content for dependent jobs.
    vars:
      cifmw_edpm_build_images_all: false
      cifmw_edpm_build_images_hardened_uefi: false
      cifmw_edpm_build_images_hardened_uefi_package: false
      cifmw_edpm_build_images_ironic_python_agent: true
      cifmw_edpm_build_images_ironic_python_agent_package: true
      cifmw_edpm_build_images_bootc: true

- job:
    name: openstack-meta-content-provider
    parent: openstack-k8s-operators-content-provider
    description: |
      A zuul job to build content (rpms, openstack services containers,
      operators) from opendev and github changes.
    timeout: 5000
    vars:
      cifmw_build_containers_exclude_containers:
        antelope: &exclude
          centos9:
            - tempest-extras
          centos10:
            - tempest-extras
        master: *exclude
      cifmw_repo_setup_extra_repos:
        - "messaging-rabbitmq-4,baseurl=https://mirror.stream.centos.org/SIGs/{{ ansible_distribution_major_version }}-stream/messaging/x86_64/rabbitmq-4/"
    pre-run:
      - ci/playbooks/meta_content_provider/copy_container_files.yaml
    run:
      - ci/playbooks/meta_content_provider/run.yml

- job:
    name: openstack-s2i-content-provider
    parent: openstack-k8s-operators-content-provider
    nodeset: centos-stream-10-content-provider
    timeout: 10800
    description: |
      Build operator images and the selected S2I service images on one
      CentOS Stream 10 content-provider node.
    required-projects:
      - github.com/openstack-k8s-operators/s2i-openstack-containers
    vars:
      cifmw_extras:
        - "@scenarios/centos-10/base.yml"
        - "@scenarios/centos-10/content_provider.yml"
      s2i_ci_container_project: github.com/openstack-k8s-operators/s2i-openstack-containers
      s2i_ci_stream: master
      s2i_ci_use_provider_pip_mirror: false
      s2i_ci_enable_rpm_cache: true
      s2i_ci_rpm_cache_use_provider_mirror: false
    run:
      - ci/playbooks/content_provider/s2i-run.yml
    post-run:
      - ci/playbooks/content_provider/s2i-post.yml

- job:
    name: ci-framework-openstack-meta-content-provider
    parent: openstack-meta-content-provider
    description: |
      A zuul job to build content (rpms, openstack services containers,
      operators) from opendev and github changes. This job will run
      against ci-framework repo to validate meta content provider
      changes.
    files:
      - ^roles/build_containers/.*
      - ^roles/build_openstack_packages/.*
      - ^roles/registry_deploy/.*
      - ^roles/edpm_build_images/.*
      - ^roles/operator_build/.*
      - ^ci/playbooks/meta_content_provider/.*
