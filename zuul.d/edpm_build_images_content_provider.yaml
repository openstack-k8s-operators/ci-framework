---
- job:
    name: content-provider-build-images-base
    parent: base-ci-framework
    nodeset: centos-stream-9
    abstract: true
    irrelevant-files:
      - ^CONTRIBUTING.md
      - ^docs/*
      - ^OWNERS*
      - roles/.*/molecule/.*
    required-projects:
      - opendev.org/zuul/zuul-jobs
      - github.com/openstack-k8s-operators/edpm-image-builder
      - github.com/openstack-k8s-operators/ci-framework
    pre-run:
      - ci/playbooks/content_provider/pre.yml
    run:
      - ci/playbooks/e2e-prepare.yml
      - ci/playbooks/dump_zuul_data.yml
      - ci/playbooks/edpm_build_images/edpm_build_images_content_provider_run.yaml
    post-run:
      - ci/playbooks/collect-logs.yml
    vars:
      cifmw_artifacts_basedir: "{{ cifmw_basedir | default(ansible_user_dir ~ '/ci-framework-data') }}"
      cifmw_repo_setup_branch: antelope
      cifmw_edpm_build_images_via_rpm: false

- job:
    name: cifmw-content-provider-bootc-cs10
    parent: content-provider-build-images-base
    nodeset: centos-stream-10
    timeout: 7200
    description: |
      Build CS10 bootc from the speculative s2i checkout, generate and package
      its qcow2 image, and publish it with IPA for dependent deployment jobs.
    required-projects:
      - github.com/openstack-k8s-operators/s2i-openstack-containers
    vars:
      cifmw_repo_setup_dist_major_version: 10
      cifmw_repo_setup_branch: master
      cifmw_repo_setup_promotion: current
      cifmw_repo_setup_dlrn_hash_tag: ""
      cifmw_extras:
        - '@scenarios/centos-10/base.yml'
      cifmw_edpm_build_images_force: true
      cifmw_edpm_build_images_all: false
      cifmw_edpm_build_images_hardened_uefi: false
      cifmw_edpm_build_images_hardened_uefi_package: false
      cifmw_edpm_build_images_ironic_python_agent: true
      cifmw_edpm_build_images_ironic_python_agent_package: true
      cifmw_edpm_build_images_bootc: true
      cifmw_edpm_build_images_bootc_use_s2i: true
      cifmw_edpm_build_images_base_image: quay.io/centos/centos:stream10-minimal
      cifmw_edpm_build_images_bootc_base_image: quay.io/centos-bootc/centos-bootc:stream10

- job:
    name: cifmw-content-provider-build-images
    parent: content-provider-build-images-base
    timeout: 2700
    vars:
      cifmw_edpm_build_images_force: true
      cifmw_edpm_build_images_bootc: true
    files:
      - ^ci/playbooks/edpm_build_images/edpm_build_images_content_provider.yaml
      - ^ci/playbooks/edpm_build_images/edpm_build_images_content_provider_run.yaml
      - ^roles/edpm_build_images/*
      - ^zuul.d/edpm_build_images_content_provider.yaml
