- hosts: "{{ cifmw_target_host | default('localhost') }}"
  vars:
    project_name: "github.com/openstack-k8s-operators/{{ operator_name }}"
    operator_basedir: >-
      {{
        zuul.projects[project_name].src_dir
        }}
  tasks:
    - name: Run hooks before running kuttl tests
      vars:
        step: pre_kuttl_from_operator
      ansible.builtin.include_role:
        name: run_hook

    - name: run kuttl tests
      # Run via ci_script so the kuttl output is streamed live to a dedicated,
      # zuul-collected file ({{ cifmw_basedir }}/logs/ci_script_NNN_run_kuttl_tests.log)
      # instead of only being returned inline in job-output.txt when the task
      # finishes. This means partial logs survive a hang/timeout.
      #
      # cifmw_zuul_target_host_env lets a job pass extra env vars (e.g.
      # KUTTL_SUITE) into the operator Make targets. Merge it last so a job
      # can override the suite selected by the operator Makefile default.
      environment: >-
        {{
          {
            'KUBECONFIG': cifmw_openshift_kubeconfig,
            'PATH': cifmw_path | default(ansible_env.PATH),
          } | combine(cifmw_zuul_target_host_env | default({}))
        }}
      cifmw.general.ci_script:
        output_dir: "{{ cifmw_basedir | default(ansible_user_dir + '/ci-framework-data') }}/artifacts"
        chdir: "{{ ansible_user_dir }}/{{ operator_basedir }}"
        script: make kuttl-test-run
