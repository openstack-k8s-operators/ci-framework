---
# Stops the background kuttl pod log collector started by
# start-pod-log-collector.yml. Hooked into the base kuttl jobs' post-run, before
# collect-logs.yml, so the captured logs under {{ cifmw_basedir }}/logs/kuttl-pod-logs
# are finalized and then shipped to zuul with the rest of ci-framework-data.
- hosts: controller
  gather_facts: false
  tasks:
    - name: Stop the collector supervisor and all stern tails
      # [k] stops pkill -f from matching its own command line (which contains the
      # script name) and killing this task.
      ansible.builtin.shell:
        cmd: >-
          pkill -f '[k]uttl-pod-log-collector.sh' || true;
          pkill -x stern || true
      changed_when: true
