---
# CRC DNS and its private key are available on the controller, not the executor.
- name: Configure registry access using Ansible running on the controller
  ansible.builtin.command:
    argv:
      - ansible-playbook
      - -i
      - "{{ cifmw_basedir | default(ansible_user_dir ~ '/ci-framework-data') }}/artifacts/zuul_inventory.yml"
      - ci/playbooks/edpm_baremetal_deployment/configure_registry.yml
      - -e
      - '@group_vars/all.yml'
      - -e
      - "@{{ cifmw_basedir | default(ansible_user_dir ~ '/ci-framework-data') }}/artifacts/parameters/zuul-params.yml"
    chdir: "{{ ansible_user_dir }}/src/github.com/openstack-k8s-operators/ci-framework"
  environment:
    ANSIBLE_CONFIG: "{{ ansible_user_dir }}/src/github.com/openstack-k8s-operators/ci-framework/ansible.cfg"
  changed_when: true
