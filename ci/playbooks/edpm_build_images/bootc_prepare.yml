---
- name: Prepare a published bootc image for baremetal deployment
  hosts: controller
  gather_facts: true
  vars:
    cifmw_edpm_build_images_ci_repo: >-
      {{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/ci-framework'].src_dir }}
    cifmw_edpm_build_images_ci_artifacts: >-
      {{ cifmw_basedir | default(ansible_user_dir ~ '/ci-framework-data') }}/artifacts

  tasks:
    - name: Package the source image and prepare its deployment handoff
      ansible.builtin.include_tasks: bootc_prepare_tasks.yml
