---
- name: Run OpenStack Lightspeed functional tests
  hosts: "{{ cifmw_target_hook_host | default('localhost') }}"
  connection: local
  vars:
    cifmw_lightspeed_tests_namespace: "{{ cifmw_openstack_lightspeed_namespace | default('openstack-lightspeed') }}"
    cifmw_lightspeed_tests_source: "{{ ansible_env.HOME }}/src/github.com/openstack-k8s-operators/lightspeed-tests"
    cifmw_lightspeed_tests_artifacts: "{{ cifmw_basedir | default(ansible_env.HOME ~ '/ci-framework-data') }}/tests/lightspeed"
    cifmw_lightspeed_tests_timeout: 120
    cifmw_lightspeed_tests_kubeconfig: "{{ cifmw_openshift_kubeconfig | default(ansible_env.HOME ~ '/.crc/machines/crc/kubeconfig') }}"
  environment:
    KUBECONFIG: "{{ cifmw_lightspeed_tests_kubeconfig }}"
  tasks:
    - name: Require the prepared test checkout
      ansible.builtin.stat:
        path: "{{ cifmw_lightspeed_tests_source }}/playbooks/run_lightspeed_tests.yaml"
      register: cifmw_lightspeed_tests_checkout
      failed_when: not cifmw_lightspeed_tests_checkout.stat.exists

    - name: Create the artifact directory
      ansible.builtin.file:
        path: "{{ cifmw_lightspeed_tests_artifacts }}"
        state: directory
        mode: '0755'

    - name: Record the prepared test revision and local changes
      ansible.builtin.shell:
        cmd: |
          git rev-parse HEAD
          git status --short
          git diff --stat
        chdir: "{{ cifmw_lightspeed_tests_source }}"
      register: cifmw_lightspeed_tests_revision
      changed_when: false

    - name: Save test revision metadata
      ansible.builtin.copy:
        dest: "{{ cifmw_lightspeed_tests_artifacts }}/source-revision.txt"
        content: "{{ cifmw_lightspeed_tests_revision.stdout }}\n"
        mode: '0644'

    - name: Create an explicit Lightspeed client identity
      kubernetes.core.k8s:
        state: present
        definition:
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: lightspeed-tests
              namespace: "{{ cifmw_lightspeed_tests_namespace }}"
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: lightspeed-tests-access
            rules:
              - nonResourceURLs: [/ls-access]
                verbs: [get]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: "lightspeed-tests-access-{{ cifmw_lightspeed_tests_namespace }}"
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: lightspeed-tests-access
            subjects:
              - kind: ServiceAccount
                name: lightspeed-tests
                namespace: "{{ cifmw_lightspeed_tests_namespace }}"

    - name: Create private temporary storage outside published artifacts
      ansible.builtin.tempfile:
        state: directory
        prefix: lightspeed-tests-
      register: cifmw_lightspeed_tests_private

    - name: Run tests through a temporary API tunnel
      block:
        - name: Issue a short lived client token
          ansible.builtin.command:
            argv: [oc, create, token, lightspeed-tests, -n, "{{ cifmw_lightspeed_tests_namespace }}", --duration=2h]
          register: cifmw_lightspeed_tests_token
          changed_when: false
          no_log: true

        - name: Store the client token privately
          ansible.builtin.copy:
            dest: "{{ cifmw_lightspeed_tests_private.path }}/token"
            content: "{{ cifmw_lightspeed_tests_token.stdout }}"
            mode: '0600'
          no_log: true

        - name: Select an unused local port
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - -c
              - "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1]); s.close()"
          register: cifmw_lightspeed_tests_port
          changed_when: false

        - name: Start the private API tunnel
          ansible.builtin.shell: |
            echo $$ > {{ (cifmw_lightspeed_tests_private.path ~ '/tunnel.pid') | quote }}
            exec oc port-forward -n {{ cifmw_lightspeed_tests_namespace | quote }} \
              service/lightspeed-app-server {{ cifmw_lightspeed_tests_port.stdout }}:8443 \
              --address=127.0.0.1 > {{ (cifmw_lightspeed_tests_artifacts ~ '/port-forward.log') | quote }} 2>&1
          async: 7200
          poll: 0
          register: cifmw_lightspeed_tests_tunnel
          changed_when: true

        - name: Wait for the API tunnel
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ cifmw_lightspeed_tests_port.stdout | int }}"
            timeout: 30

        - name: Run integration tests against the deployed application
          ansible.builtin.include_tasks: tasks/lightspeed-test-stage.yml
          vars:
            cifmw_lightspeed_tests_stage: baseline
            cifmw_lightspeed_tests_pytest_args: "-v --tb=short --color=no tests/integration"

      always:
        - name: Stop only the API tunnel started by this playbook
          ansible.builtin.shell: |
            if test -f {{ (cifmw_lightspeed_tests_private.path ~ '/tunnel.pid') | quote }}; then
              kill -TERM "$(cat {{ (cifmw_lightspeed_tests_private.path ~ '/tunnel.pid') | quote }})"
            fi
          changed_when: true
          failed_when: false

        - name: Remove the tunnel asynchronous task record
          ansible.builtin.async_status:
            jid: "{{ cifmw_lightspeed_tests_tunnel.ansible_job_id }}"
            mode: cleanup
          when: cifmw_lightspeed_tests_tunnel.ansible_job_id is defined
          failed_when: false

        - name: Remove the private token and tunnel process record
          ansible.builtin.file:
            path: "{{ cifmw_lightspeed_tests_private.path }}"
            state: absent
