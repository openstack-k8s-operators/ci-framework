---
- name: Kustomize ControlPlane for glance over swift with quota
  hosts: "{{ cifmw_target_hook_host | default('localhost') }}"
  gather_facts: false
  vars:
    cifmw_controlplane_kustomizations_path: "{{ cifmw_basedir }}/artifacts/manifests/kustomizations/controlplane"
    glance_operator_path: "{{ cifmw_glance_operator_path|default(ansible_user_dir+'/src/github.com/openstack-k8s-operators/glance-operator') }}"
  tasks:
    - name: Ensure the kustomizations dir exists
      ansible.builtin.file:
        path: "{{ cifmw_controlplane_kustomizations_path }}"
        state: directory
        mode: '755'

    - name: Create kustomization to enable swift as glance backend plus quota
      ansible.builtin.template:
        dest: "{{ cifmw_controlplane_kustomizations_path }}/90-glance-swift-quota.yaml"
        src: glance_swift_quota_kustomize.yaml.j2
        mode: '644'
