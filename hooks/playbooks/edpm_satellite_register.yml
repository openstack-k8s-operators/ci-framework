# Hook used by the Satellite jobs. It runs right after the EDPM nodeset CR is
# applied (post_stage of edpm-pre-ceph-nodeset) and before the deployment stage
# runs the bootstrap service, appending the Satellite registration command to
# the nodeset edpm_bootstrap_command so the compute nodes register and get the
# RHEL repos needed by edpm_bootstrap.
- name: Append Satellite registration to the EDPM bootstrap command
  hosts: "{{ cifmw_target_hook_host | default('localhost') }}"
  gather_facts: false
  tasks:
    - name: Run edpm_satellite_register role
      ansible.builtin.import_role:
        name: edpm_satellite_register
