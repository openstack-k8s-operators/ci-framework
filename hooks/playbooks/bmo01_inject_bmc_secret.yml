# Render the bmo01 bmc-secret.env from the Redfish credentials (which come from
# the sushy_emulator_vbmc_creds Zuul secret via cifmw_redfish_username/password)
# into the architecture checkout, so the kustomize secretGenerator produces a
# bmc-secret that matches the sushy-emulator credentials. The rendered value is
# never committed, so it satisfies the architecture check-bmc-secrets CI gate.
# Run as a pre_stage_run hook on the bmo01 baremetalhosts-configuration stage.
- name: Inject real BMC credentials into bmo01 bmc-secret.env
  hosts: "{{ cifmw_target_hook_host | default('localhost') }}"
  gather_facts: false
  tasks:
    - name: Render bmc-secret.env from redfish credentials
      ansible.builtin.copy:
        dest: >-
          {{
            [
              cifmw_architecture_repo,
              'examples', 'dt', 'bmo01', 'dataplane', 'baremetalhosts',
              'bmc-secret.env'
            ] | ansible.builtin.path_join
          }}
        mode: "0600"
        content: |
          username={{ cifmw_redfish_username }}
          password={{ cifmw_redfish_password }}
      no_log: true
