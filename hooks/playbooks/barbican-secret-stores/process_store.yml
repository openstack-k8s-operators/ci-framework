---
# Prepare then configure one store instance (loop_var: store).

- name: Resolve provider module name for {{ store.id }}
  ansible.builtin.set_fact:
    _bss_provider: >-
      {{ store.provider
         | default('software' if store.type == 'simple_crypto' else '') }}

- name: Prepare provider {{ _bss_provider }} for {{ store.id }}
  ansible.builtin.include_tasks: "prepare/{{ _bss_provider }}.yml"

- name: Configure provider {{ _bss_provider }} for {{ store.id }}
  ansible.builtin.include_tasks: "config/{{ _bss_provider }}.yml"
