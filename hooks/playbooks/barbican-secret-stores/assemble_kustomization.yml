---
# Merge collected fragments into one OpenStackControlPlane kustomization.
# Operator CRD uses store *types* for enabledSecretStores / globalDefault;
# instance ids are a CI concern only (resolved earlier to _bss_global_default_type).

- name: Deduplicate enabledSecretStores types (preserve order)
  ansible.builtin.set_fact:
    _bss_enabled_unique: "{{ _bss_enabled_types | unique | list }}"

- name: Join customServiceConfig sections
  ansible.builtin.set_fact:
    _bss_custom_service_config: "{{ _bss_ini_sections | join('\n') }}"
  no_log: true

- name: Write Barbican secret-stores kustomization
  ansible.builtin.template:
    src: 93-barbican-secret-stores.yaml.j2
    dest: "{{ cifmw_manifests_dir }}/kustomizations/controlplane/93-barbican-secret-stores.yaml"
    mode: "0644"
  no_log: true
