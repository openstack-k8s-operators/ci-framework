---
# Prepare (and stage) one store instance (loop_var: store).
# Staging variant of process_store.yml without the config phase:
# adoption flows render the RHOSO 18 side via data-plane-adoption's
# barbican_hsm_patch, not via the kustomization hook.

- name: Resolve provider module name for {{ store.id }}
  ansible.builtin.set_fact:
    _bss_provider: >-
      {{ store.provider
         | default('software' if store.type == 'simple_crypto' else '') }}

- name: Prepare provider {{ _bss_provider }} for {{ store.id }}
  ansible.builtin.include_tasks: "{{ playbook_dir }}/prepare/{{ _bss_provider }}.yml"
