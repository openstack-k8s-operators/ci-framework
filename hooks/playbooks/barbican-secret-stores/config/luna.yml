---
# Luna PKCS11 → pkcs11 CRD fragment + [p11_crypto_plugin] customServiceConfig.
#
# Required store fields: partition, mkek_label, hmac_label
# Optional store.config: p11_crypto_plugin setting overrides (unknown keys
# are rejected). Environment wiring (partition, labels, PIN, certs, client
# sources) stays flat on the store dict.
# Uses _bss_luna_prep from prepare/luna.yml for secret names / mount path.

- name: Luna p11_crypto_plugin defaults
  ansible.builtin.set_fact:
    _bss_luna_defaults:
      library_path: /usr/local/luna/libs/64/libCryptoki2.so
      encryption_mechanism: CKM_AES_GCM
      # With false, Luna returns ciphertext that Barbican's Safenet GCM
      # decrypt path strips as PKCS7 when the last byte is 0x01, corrupting
      # payloads ending in 0x01. Keep the documented default (bug #2173006).
      aes_gcm_generate_iv: true
      hmac_key_type: CKK_GENERIC_SECRET
      hmac_keygen_mechanism: CKM_GENERIC_SECRET_KEY_GEN
      hmac_mechanism: CKM_SHA256_HMAC
      key_wrap_mechanism: CKM_AES_CBC_PAD
      key_wrap_generate_iv: true
      always_set_cka_sensitive: true
      os_locking_ok: false

- name: Reject unknown Luna config overrides on {{ store.id }}
  ansible.builtin.assert:
    that:
      - store.config | default({}) | list
        | difference(_bss_luna_defaults | list) | length == 0
    fail_msg: >-
      Luna store {{ store.id }}: unknown config override(s)
      {{ store.config | default({}) | list
         | difference(_bss_luna_defaults | list) }};
      known keys: {{ _bss_luna_defaults | list | join(', ') }}.

- name: Merge Luna config overrides for {{ store.id }}
  ansible.builtin.set_fact:
    _luna_cfg: >-
      {{ _bss_luna_defaults | combine(store.config | default({})) }}

- name: Require Luna config fields on store {{ store.id }}
  ansible.builtin.assert:
    that:
      - store.partition is defined
      - store.partition | length > 0
      - store.mkek_label is defined
      - store.mkek_label | length > 0
      - store.hmac_label is defined
      - store.hmac_label | length > 0
    fail_msg: >-
      Luna store {{ store.id }} needs partition, mkek_label, and hmac_label.

- name: Build Luna p11_crypto_plugin section for {{ store.id }}
  ansible.builtin.set_fact:
    _luna_ini: |
      [p11_crypto_plugin]
      plugin_name = PKCS11
      library_path = {{ _luna_cfg.library_path }}
      token_labels = {{ store.partition }}
      mkek_label = {{ store.mkek_label }}
      hmac_label = {{ store.hmac_label }}
      encryption_mechanism = {{ _luna_cfg.encryption_mechanism }}
      aes_gcm_generate_iv = {{ _luna_cfg.aes_gcm_generate_iv | lower }}
      hmac_key_type = {{ _luna_cfg.hmac_key_type }}
      hmac_keygen_mechanism = {{ _luna_cfg.hmac_keygen_mechanism }}
      hmac_mechanism = {{ _luna_cfg.hmac_mechanism }}
      key_wrap_mechanism = {{ _luna_cfg.key_wrap_mechanism }}
      key_wrap_generate_iv = {{ _luna_cfg.key_wrap_generate_iv | lower }}
      always_set_cka_sensitive = {{ _luna_cfg.always_set_cka_sensitive | lower }}
      os_locking_ok = {{ _luna_cfg.os_locking_ok | lower }}

- name: Record Luna pkcs11 fragments for {{ store.id }}
  ansible.builtin.set_fact:
    _bss_enabled_types: "{{ _bss_enabled_types + ['pkcs11'] }}"
    _bss_pkcs11_spec:
      loginSecret: "{{ _bss_luna_prep.login_secret }}"
      clientDataSecret: "{{ _bss_luna_prep.client_data_secret }}"
      clientDataPath: "{{ _bss_luna_prep.client_data_path }}"
    _bss_ini_sections: "{{ _bss_ini_sections + [_luna_ini] }}"
