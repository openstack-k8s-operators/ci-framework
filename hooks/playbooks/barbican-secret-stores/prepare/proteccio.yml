---
# Proteccio PKCS11 — bake images and create client-data + login Secrets.
# All instance settings come from the store dict.
#
# Required: conf_src, client_src, client_crt_src, client_key_src,
#   server_crt_src, and partition_password (or pin_file + pin_file_key)
#
# PIN resolution uses resolve_from_param_or_file.yml:
#   partition_password: "{{ proteccio_hsm_password.password }}"
#   # — or —
#   pin_file: /var/tmp/qe-secrets/proteccio_pin.yaml
#   pin_file_key: rdu2Pin
#
# Optional: ansible_role_repo, ansible_role_version, client_iso,
#   client_data_secret, client_data_secret_namespace, login_secret,
#   login_secret_field, client_data_path, pin_file

- name: Resolve Proteccio partition password for {{ store.id }}
  ansible.builtin.include_tasks: "{{ playbook_dir }}/resolve_from_param_or_file.yml"
  vars:
    rpf_name: "Proteccio store {{ store.id }} partition_password"
    rpf_fact: _proteccio_password
    rpf_value: "{{ store.partition_password | default('') }}"
    rpf_file: "{{ store.pin_file | default('/var/tmp/qe-secrets/proteccio_pin.yaml') }}"
    rpf_file_key: "{{ store.pin_file_key | default('') }}"
    rpf_required: true

- name: Require Proteccio prepare fields on store {{ store.id }}
  ansible.builtin.assert:
    that:
      - store.conf_src is defined
      - store.conf_src | length > 0
      - store.client_src is defined
      - store.client_src | length > 0
      - store.client_crt_src is defined
      - store.client_crt_src | length > 0
      - store.client_key_src is defined
      - store.client_key_src | length > 0
      - store.server_crt_src is defined
      - store.server_crt_src | length > 0
    fail_msg: >-
      Proteccio store {{ store.id }} needs conf_src, client_src,
      client_crt_src, client_key_src, and server_crt_src.

- name: Check out the Proteccio HSM role git repo for {{ store.id }}
  ansible.builtin.git:
    dest: "./rhoso_proteccio_hsm"
    repo: "{{ store.ansible_role_repo | default('https://github.com/openstack-k8s-operators/ansible-role-rhoso-proteccio-hsm.git') }}"
    version: "{{ store.ansible_role_version | default('main') }}"

- name: Create and upload Proteccio-baked Barbican images for {{ store.id }}
  ansible.builtin.include_role:
    name: rhoso_proteccio_hsm
    tasks_from: create_image
  vars:
    barbican_src_api_image_name: >-
      {{ cifmw_hsm_barbican_src_api_image_name |
         default(cifmw_barbican_src_api_image_name |
                 default('openstack-barbican-api')) }}
    barbican_src_worker_image_name: >-
      {{ cifmw_hsm_barbican_src_worker_image_name |
         default(cifmw_barbican_src_worker_image_name |
                 default('openstack-barbican-worker')) }}
    barbican_src_image_registry: >-
      {{ cifmw_hsm_barbican_src_image_registry |
         default(content_provider_registry_ip ~ ':5001') }}
    barbican_src_image_namespace: >-
      {{ cifmw_hsm_barbican_src_image_namespace |
         default(cifmw_update_containers_org |
                 default(cifmw_default_container_image_namespace)) }}
    barbican_src_image_tag: >-
      {{ cifmw_hsm_barbican_src_image_tag |
         default(cifmw_update_containers_tag | default('component-ci-testing')) }}
    barbican_dest_api_image_name: >-
      {{ cifmw_hsm_barbican_dest_api_image_name |
         default(cifmw_barbican_dest_api_image_name |
                 default('openstack-barbican-api')) }}
    barbican_dest_worker_image_name: >-
      {{ cifmw_hsm_barbican_dest_worker_image_name |
         default(cifmw_barbican_dest_worker_image_name |
                 default('openstack-barbican-worker')) }}
    barbican_dest_image_registry: >-
      {{ cifmw_hsm_barbican_dest_image_registry |
         default(content_provider_registry_ip ~ ':5001') }}
    barbican_dest_image_namespace: >-
      {{ cifmw_hsm_barbican_dest_image_namespace |
         default(cifmw_update_containers_org |
                 default(cifmw_default_container_image_namespace)) }}
    barbican_dest_image_tag: "{{ cifmw_update_containers_barbican_custom_tag }}"
    image_registry_verify_tls: "{{ cifmw_image_registry_verify_tls | default('false', true) }}"
    proteccio_client_src: "{{ store.client_src }}"
    proteccio_client_iso: "{{ store.client_iso | default('Proteccio3.06.05.iso') }}"

- name: Create Proteccio client-data and login secrets for {{ store.id }}
  ansible.builtin.include_role:
    name: rhoso_proteccio_hsm
    tasks_from: create_secrets
  vars:
    proteccio_conf_src: "{{ store.conf_src }}"
    proteccio_client_crt_src: "{{ store.client_crt_src }}"
    proteccio_client_key_src: "{{ store.client_key_src }}"
    proteccio_server_crt_src: "{{ store.server_crt_src }}"
    proteccio_password: "{{ _proteccio_password }}"
    kubeconfig_path: "{{ cifmw_openshift_kubeconfig }}"
    oc_dir: "{{ cifmw_path }}"
    proteccio_data_secret: "{{ store.client_data_secret | default('barbican-proteccio-client-data') }}"
    proteccio_data_secret_namespace: "{{ store.client_data_secret_namespace | default(namespace) }}"
    login_secret: "{{ store.login_secret | default('barbican-proteccio-login') }}"
    login_secret_field: "{{ store.login_secret_field | default('PKCS11Pin') }}"

- name: Stash Proteccio prepare results for {{ store.id }}
  ansible.builtin.set_fact:
    _bss_proteccio_prep:
      client_data_secret: "{{ store.client_data_secret | default('barbican-proteccio-client-data') }}"
      login_secret: "{{ store.login_secret | default('barbican-proteccio-login') }}"
      client_data_path: "{{ store.client_data_path | default('/etc/proteccio') }}"
