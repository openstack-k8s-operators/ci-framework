---
# Run a MariaDB statement inside the Galera pod.
# Set cifmw_barbican_migrate_sql to the SQL string.
# Result is cifmw_barbican_migrate_sql_result (no_log).

- name: "{{ cifmw_barbican_migrate_sql_desc | default('Query Barbican MariaDB') }}"
  ansible.builtin.command:
    argv:
      - oc
      - -n
      - "{{ cifmw_barbican_migrate_namespace }}"
      - exec
      - "{{ cifmw_barbican_migrate_galera_pod }}"
      - -c
      - "{{ cifmw_barbican_migrate_galera_container }}"
      - --
      - mysql
      - "--user={{ cifmw_barbican_migrate_db_user }}"
      - "--password={{ _db_password }}"
      - "--database={{ cifmw_barbican_migrate_db_name }}"
      - --batch
      - --skip-column-names
      - "--execute={{ cifmw_barbican_migrate_sql }}"
  register: cifmw_barbican_migrate_sql_result
  changed_when: false
  no_log: true
