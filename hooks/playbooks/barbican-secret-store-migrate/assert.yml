---
# Assert a secret is on the expected Barbican secret-store catalogue entry.
#
# Microversion 1.3 secret metadata always includes secret_store_id and
# secret_store_ref (UUID/href, or null when there is no live payload).
# RHOSO 18.0's python-barbicanclient (5.5.0) cannot negotiate
# key-manager 1.3, so fetch via REST with an explicit version header
# (helper cifmw_barbican_migrate_rest_get_store_py from migrate.yml).
#
# Expects:
#   cifmw_barbican_migrate_assert_label
#   cifmw_barbican_migrate_assert_secret_id
#   cifmw_barbican_migrate_assert_store  (id, store_plugin, crypto_plugin)
#   cifmw_barbican_migrate_osc_exec
#   cifmw_barbican_migrate_rest_get_store_py

- name: "{{ cifmw_barbican_migrate_assert_label }}: get secret metadata"
  ansible.builtin.command:
    argv: "{{ cifmw_barbican_migrate_osc_exec + [
      'python3', '-c', cifmw_barbican_migrate_rest_get_store_py,
      cifmw_barbican_migrate_assert_secret_id,
    ] }}"
  register: _assert_secret_get
  changed_when: false
  no_log: true

- name: "{{ cifmw_barbican_migrate_assert_label }}: assert secret_store_id"
  ansible.builtin.assert:
    that:
      - "'secret_store_id' in (_assert_secret_get.stdout | from_json)"
      - "'secret_store_ref' in (_assert_secret_get.stdout | from_json)"
      - (_assert_secret_get.stdout | from_json)['secret_store_id'] == cifmw_barbican_migrate_assert_store.id
      - cifmw_barbican_migrate_assert_store.id in ((_assert_secret_get.stdout | from_json)['secret_store_ref'] | default(''))
    fail_msg: >-
      {{ cifmw_barbican_migrate_assert_label }}: expected secret_store_id
      '{{ cifmw_barbican_migrate_assert_store.id }}', got
      '{{ (_assert_secret_get.stdout | from_json)['secret_store_id'] | default('missing') }}'.
