---
# Live-migrate Barbican secrets across every enabled secret store.
#
# Store set and catalogue UUIDs come from GET /v1/secret-stores
# (openstacksdk in the openstackclient pod) — the same ids the migrate
# API and microversion 1.3 secret_store_id assert require. Store
# discovery stays on the REST API: upstream review 1005933 (OSC
# secret-store commands) is not expected to land soon. Creates on the
# global-default store (OSC has no preferred-store command), then for
# each other store runs: REST-API round-trip (PUT
# /secrets/{id}/secret-store/{ss-id}, microversion 1.3), an
# openstack-CLI round-trip when the deployed client has `secret
# migrate` (downstream trunk-patches backport of review 1002401;
# capability-gated), barbican-manage secret migrate round-trip,
# dry-run, and (once) a metadata-only conflict against the first
# destination.
#
# Optional: cifmw_barbican_migrate_secret_type (e.g. symmetric) is
# passed through to openstack secret store when set.
#
# Wire as post_tests (after tempest on the default store):
#
#   post_tests:
#     - name: 90 Barbican secret-store migrate
#       type: playbook
#       source: "{{ ci_framework_base_src_dir }}/hooks/playbooks/barbican-secret-store-migrate/migrate.yml"
#
# Related: OSPRH-35280 / OSPRH-35261 / RHOSSTRAT-1435

- name: Test Barbican secret-store migrate via GET secret_store_id
  hosts: "{{ cifmw_target_hook_host | default('localhost') }}"
  gather_facts: false
  vars:
    cifmw_barbican_migrate_namespace: "{{ namespace | default(cifmw_openstack_namespace) | default('openstack') }}"
    cifmw_barbican_migrate_osc_pod_name: openstackclient
    cifmw_barbican_migrate_api_label: component=barbican-api
    cifmw_barbican_migrate_api_container: barbican-api
    _oc_env:
      KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
      PATH: "{{ cifmw_path }}"
    # Shared REST helpers, run as `python3 -c <script> <args>` inside
    # the openstackclient pod. RHOSO 18.0 ships python-barbicanclient
    # 5.5.0: it has no `secret migrate` command and does not negotiate
    # key-manager microversion 1.3, so the suite calls the migrate API
    # directly with an explicit OpenStack-API-Version header.
    cifmw_barbican_migrate_rest_get_store_py: |
      import json
      import sys

      import openstack

      secret_id = sys.argv[1]
      conn = openstack.connect()
      ep = conn.key_manager.get_endpoint().rstrip('/')
      resp = conn.session.get(
          ep + '/secrets/' + secret_id,
          headers={'OpenStack-API-Version': 'key-manager 1.3'})
      resp.raise_for_status()
      data = resp.json()
      print(json.dumps({
          'secret_store_id': data.get('secret_store_id'),
          'secret_store_ref': data.get('secret_store_ref'),
      }))
    cifmw_barbican_migrate_rest_migrate_py: |
      import sys

      from keystoneauth1.exceptions import http as kshttp

      import openstack

      secret_id, store_id = sys.argv[1], sys.argv[2]
      conn = openstack.connect()
      ep = conn.key_manager.get_endpoint().rstrip('/')
      url = ep + '/secrets/' + secret_id + '/secret-store/' + store_id
      try:
          resp = conn.session.put(
              url, headers={'OpenStack-API-Version': 'key-manager 1.3'})
          print(resp.status_code)
      except kshttp.HttpError as exc:
          print(exc.http_status)
          print(str(exc)[:500])
  environment: "{{ _oc_env }}"
  tasks:
    - name: Get openstackclient pod
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
        api_key: "{{ cifmw_openshift_token | default(omit) }}"
        context: "{{ cifmw_openshift_context | default(omit) }}"
        api_version: v1
        kind: Pod
        namespace: "{{ cifmw_barbican_migrate_namespace }}"
        name: "{{ cifmw_barbican_migrate_osc_pod_name }}"
      register: _osc_pod_info

    - name: Get Barbican API pods
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
        api_key: "{{ cifmw_openshift_token | default(omit) }}"
        context: "{{ cifmw_openshift_context | default(omit) }}"
        api_version: v1
        kind: Pod
        namespace: "{{ cifmw_barbican_migrate_namespace }}"
        label_selectors:
          - "{{ cifmw_barbican_migrate_api_label }}"
        field_selectors:
          - status.phase=Running
      register: _barbican_api_pod_info

    - name: Fail if required pods are missing
      ansible.builtin.assert:
        that:
          - _osc_pod_info.resources | length > 0
          - _barbican_api_pod_info.resources | length > 0
        fail_msg: >-
          Need Running openstackclient and a pod labelled
          {{ cifmw_barbican_migrate_api_label }} in
          {{ cifmw_barbican_migrate_namespace }}.

    - name: Set pod names and shared oc-exec argv prefixes
      ansible.builtin.set_fact:
        cifmw_barbican_migrate_osc_pod: "{{ _osc_pod_info.resources[0].metadata.name }}"
        cifmw_barbican_migrate_api_pod: "{{ _barbican_api_pod_info.resources[0].metadata.name }}"
        cifmw_barbican_migrate_osc_exec: "{{ [
          'oc', '-n', cifmw_barbican_migrate_namespace,
          'exec', _osc_pod_info.resources[0].metadata.name, '--',
        ] }}"
        cifmw_barbican_migrate_api_exec: "{{ [
          'oc', '-n', cifmw_barbican_migrate_namespace,
          'exec', _barbican_api_pod_info.resources[0].metadata.name,
          '-c', cifmw_barbican_migrate_api_container, '--',
        ] }}"

    # `openstack secret migrate` landed downstream (python-barbicanclient
    # backport of review 1002401, on trunk-patches) but older
    # openstackclient images lack the command. Gate the CLI scenario on
    # the command class actually being importable in the deployed image.
    - name: Check whether the openstack CLI has secret migrate
      ansible.builtin.command:
        argv: "{{ cifmw_barbican_migrate_osc_exec + [
          'python3', '-c',
          'from barbicanclient.barbican_cli.v1.secrets import MigrateSecret',
        ] }}"
      register: _cli_migrate_check
      failed_when: false
      changed_when: false

    - name: Record openstack CLI migrate availability
      ansible.builtin.set_fact:
        cifmw_barbican_migrate_cli_available: "{{ _cli_migrate_check.rc == 0 }}"

    # OSC has no secret-store list command (review 1005933 stalled) and
    # deployed openstacksdk releases have no secret-stores resource, so
    # use the key-manager REST API from openstacksdk's session in the
    # OSC pod. The catalogue id is the last path segment of
    # secret_store_ref — the same id the migrate API and microversion
    # 1.3 secret_store_id assert require.
    - name: List secret stores via key-manager REST API
      ansible.builtin.command:
        argv: "{{ cifmw_barbican_migrate_osc_exec + [
          'python3', '-c', _list_stores_py,
        ] }}"
      vars:
        _list_stores_py: |
          import json
          import openstack
          conn = openstack.connect()
          ep = conn.key_manager.get_endpoint()
          r = conn.session.get(ep.rstrip('/') + '/secret-stores')
          r.raise_for_status()
          stores = []
          for s in r.json().get('secret_stores', []):
              stores.append({
                  'id': s['secret_store_ref'].rstrip('/').split('/')[-1],
                  'store_plugin': s.get('secret_store_plugin') or '',
                  'crypto_plugin': s.get('crypto_plugin') or '',
                  'global_default': bool(s.get('global_default')),
              })
          print(json.dumps(stores))
      register: _stores_raw
      changed_when: false
      no_log: true

    - name: Parse secret stores
      ansible.builtin.set_fact:
        _secret_stores: "{{ _stores_raw.stdout | from_json }}"

    - name: Require at least two stores and one global default
      vars:
        _defaults: "{{ _secret_stores | selectattr('global_default', 'in', [true, True, 'True', 'true', 1, '1']) | list }}"
      ansible.builtin.assert:
        that:
          - _secret_stores | length >= 2
          - _defaults | length == 1
        fail_msg: >-
          Need >=2 secret stores and exactly one global_default from
          GET /v1/secret-stores (got {{ _secret_stores | length }} stores,
          {{ _defaults | length }} defaults). Stores: {{ _secret_stores }}

    - name: Set global-default source and destinations
      vars:
        _defaults: "{{ _secret_stores | selectattr('global_default', 'in', [true, True, 'True', 'true', 1, '1']) | list }}"
      ansible.builtin.set_fact:
        _store_src: "{{ _defaults[0] }}"
        _store_destinations: "{{ _secret_stores | rejectattr('id', 'equalto', _defaults[0].id) | list }}"

    - name: Choose a payload for this run
      ansible.builtin.set_fact:
        _payload: "ci-migrate-payload-{{ 999999 | random }}"

    - name: Migrate from global default to each other store
      ansible.builtin.include_tasks: pair.yml
      loop: "{{ _store_destinations }}"
      loop_control:
        loop_var: _store_dst
        extended: true
        label: "{{ _store_src.store_plugin }}/{{ _store_src.crypto_plugin }} → {{ _store_dst.store_plugin }}/{{ _store_dst.crypto_plugin }}"
      vars:
        cifmw_barbican_migrate_src_store: "{{ _store_src }}"
        cifmw_barbican_migrate_dst_store: "{{ _store_dst }}"
        # Pass-through; pair/scenario use | default('') — do not self-assign
        # (ansible-lint jinja[invalid] recursive loop).
        cifmw_barbican_migrate_pair_label: >-
          {{ (_store_src.crypto_plugin or _store_src.store_plugin) ~ '_to_'
             ~ (_store_dst.crypto_plugin or _store_dst.store_plugin) }}
        cifmw_barbican_migrate_run_metaonly: "{{ ansible_loop.first }}"
