---
# Metadata-only secrets have no payload and must fail migrate (HTTP 400).

- name: Metadata-only migrate must conflict
  block:
    - name: Create metadata-only secret
      ansible.builtin.command:
        argv:
          - oc
          - -n
          - "{{ cifmw_barbican_migrate_namespace }}"
          - exec
          - "{{ cifmw_barbican_migrate_osc_pod }}"
          - --
          - openstack
          - secret
          - store
          - --name
          - ci-migrate-metaonly
          - -f
          - value
          - -c
          - Secret href
      register: _meta_create
      changed_when: false
      no_log: true

    - name: Parse metadata-only secret
      ansible.builtin.set_fact:
        _meta_secret_href: "{{ _meta_create.stdout | trim }}"

    - name: Migrate metadata-only secret (expect conflict)
      ansible.builtin.command:
        argv:
          - oc
          - -n
          - "{{ cifmw_barbican_migrate_namespace }}"
          - exec
          - "{{ cifmw_barbican_migrate_osc_pod }}"
          - --
          - openstack
          - secret
          - migrate
          - "{{ _meta_secret_href }}"
          - --secret-store
          - "{{ _store_other.id }}"
      register: _meta_migrate
      changed_when: false
      failed_when: false

    - name: Assert metadata-only migrate failed
      ansible.builtin.assert:
        that:
          - _meta_migrate.rc != 0
          - >-
              ('400' in (_meta_migrate.stderr | default('')))
              or ('Bad Request' in (_meta_migrate.stderr | default('')))
              or ('no stored payload' in (_meta_migrate.stderr | default('')))
              or ('400' in (_meta_migrate.stdout | default('')))
              or ('Bad Request' in (_meta_migrate.stdout | default('')))
              or ('no stored payload' in (_meta_migrate.stdout | default('')))
        fail_msg: >-
          Metadata-only migrate should fail with HTTP 400 / Bad Request.
          rc={{ _meta_migrate.rc }}
          stderr={{ _meta_migrate.stderr | default('') }}

    - name: Get metadata-only secret (expect null secret_store_id)
      when: _meta_secret_href is defined
      ansible.builtin.command:
        argv:
          - oc
          - -n
          - "{{ cifmw_barbican_migrate_namespace }}"
          - exec
          - "{{ cifmw_barbican_migrate_osc_pod }}"
          - --
          - openstack
          - secret
          - get
          - "{{ _meta_secret_href }}"
          - -f
          - json
      register: _meta_get
      changed_when: false
      no_log: true

    - name: Assert metadata-only secret has null store fields
      when: _meta_get is defined and _meta_get is not skipped
      ansible.builtin.assert:
        that:
          - "'Secret store id' in (_meta_get.stdout | from_json)"
          - "'Secret store href' in (_meta_get.stdout | from_json)"
          - (_meta_get.stdout | from_json)['Secret store id'] is none
          - (_meta_get.stdout | from_json)['Secret store href'] is none
        fail_msg: >-
          Metadata-only secret should include Secret store id/href as null.
          body={{ _meta_get.stdout | default('') }}
  always:
    - name: Delete metadata-only secret
      when: _meta_secret_href is defined
      ansible.builtin.command:
        argv:
          - oc
          - -n
          - "{{ cifmw_barbican_migrate_namespace }}"
          - exec
          - "{{ cifmw_barbican_migrate_osc_pod }}"
          - --
          - openstack
          - secret
          - delete
          - "{{ _meta_secret_href }}"
      changed_when: false
      failed_when: false
      no_log: true
