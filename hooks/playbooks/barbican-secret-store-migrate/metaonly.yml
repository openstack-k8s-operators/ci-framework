---
# Metadata-only secrets have no payload and must fail migrate (HTTP 400),
# and their microversion 1.3 metadata must report null secret_store_id and
# secret_store_ref. Uses the shared REST helpers from migrate.yml because
# python-barbicanclient 5.5.0 has no migrate command and cannot negotiate
# key-manager 1.3.

- name: Metadata-only migrate must conflict
  block:
    - name: Create metadata-only secret
      ansible.builtin.command:
        argv: "{{ cifmw_barbican_migrate_osc_exec + [
          'openstack', 'secret', 'store',
          '--name', 'ci-migrate-metaonly',
          '-f', 'value', '-c', 'Secret href',
        ] }}"
      register: _meta_create
      changed_when: false
      no_log: true

    - name: Parse metadata-only secret
      ansible.builtin.set_fact:
        _meta_secret_href: "{{ _meta_create.stdout | trim }}"
        _meta_secret_id: "{{ _meta_create.stdout | trim | regex_replace('.*/', '') }}"

    - name: Migrate metadata-only secret (expect conflict)
      ansible.builtin.command:
        argv: "{{ cifmw_barbican_migrate_osc_exec + [
          'python3', '-c', cifmw_barbican_migrate_rest_migrate_py,
          _meta_secret_id,
          cifmw_barbican_migrate_dst_store.id,
        ] }}"
      register: _meta_migrate
      changed_when: false

    - name: Assert metadata-only migrate failed
      ansible.builtin.assert:
        that:
          - _meta_migrate.rc == 0
          - (_meta_migrate.stdout_lines | first | default('')) == '400'
        fail_msg: >-
          Metadata-only migrate should fail with HTTP 400. rc={{ _meta_migrate.rc }}
          stdout={{ _meta_migrate.stdout | default('') }}
          stderr={{ _meta_migrate.stderr | default('') }}

    - name: Get metadata-only secret store fields (expect null)
      ansible.builtin.command:
        argv: "{{ cifmw_barbican_migrate_osc_exec + [
          'python3', '-c', cifmw_barbican_migrate_rest_get_store_py,
          _meta_secret_id,
        ] }}"
      register: _meta_get
      changed_when: false
      no_log: true

    - name: Assert metadata-only secret has null store fields
      ansible.builtin.assert:
        that:
          - (_meta_get.stdout | from_json)['secret_store_id'] is none
          - (_meta_get.stdout | from_json)['secret_store_ref'] is none
        fail_msg: >-
          Metadata-only secret should report null secret store fields.
          body={{ _meta_get.stdout | default('') }}
  always:
    - name: Delete metadata-only secret
      when: _meta_secret_href is defined
      ansible.builtin.command:
        argv: "{{ cifmw_barbican_migrate_osc_exec + [
          'openstack', 'secret', 'delete', _meta_secret_href,
        ] }}"
      changed_when: false
      failed_when: false
      no_log: true
